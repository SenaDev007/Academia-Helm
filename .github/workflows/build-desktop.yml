name: Build Desktop App (Tauri)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install web-app dependencies
        run: |
          cd apps/web-app
          npm install

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0"

      - name: Build desktop app
        run: |
          cd apps/desktop
          cargo tauri build
        env:
          NEXT_PUBLIC_API_URL: https://api.academiahelm.com/api
          NEXT_PUBLIC_APP_URL: https://app.academiahelm.com
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_KEY_PASSWORD }}

      - name: Rename artifacts with version
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="dev-$(date +%Y%m%d%H%M%S)"
          fi

          cd apps/desktop/src-tauri/target/release/bundle

          if ls msi/*.msi 1> /dev/null 2>&1; then
            for f in msi/*.msi; do
              mv "$f" "msi/Academia-Helm-${VERSION}-windows.msi"
            done
          fi

          if ls nsis/*.exe 1> /dev/null 2>&1; then
            for f in nsis/*.exe; do
              mv "$f" "nsis/Academia-Helm-${VERSION}-windows-setup.exe"
            done
          fi

          echo "=== Artifacts Windows générés ==="
          find . -name "*.msi" -o -name "*.exe" | head -10

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: academia-helm-windows-msi
          path: apps/desktop/src-tauri/target/release/bundle/msi/*.msi

      - name: Upload EXE (NSIS setup)
        uses: actions/upload-artifact@v4
        with:
          name: academia-helm-windows-exe
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install web-app dependencies
        run: |
          cd apps/web-app
          npm install

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0"

      - name: Build desktop app
        run: |
          cd apps/desktop
          cargo tauri build
        env:
          NEXT_PUBLIC_API_URL: https://api.academiahelm.com/api
          NEXT_PUBLIC_APP_URL: https://app.academiahelm.com
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_KEY_PASSWORD }}

      - name: Rename DMG with version
        run: |
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="dev-$(date +%Y%m%d%H%M%S)"
          fi

          cd apps/desktop/src-tauri/target/release/bundle/dmg
          for f in *.dmg; do
            if [ -f "$f" ]; then
              mv "$f" "Academia-Helm-${VERSION}-macos.dmg"
            fi
          done

          echo "=== Artifacts macOS générés ==="
          ls -la *.dmg 2>/dev/null || echo "Aucun DMG trouvé"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: academia-helm-macos-dmg
          path: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: |
          echo "=== Artifacts à publier ==="
          find artifacts -type f | head -20

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/academia-helm-windows-msi/*.msi
            artifacts/academia-helm-windows-exe/*.exe
            artifacts/academia-helm-macos-dmg/*.dmg
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ## 📥 Téléchargements

            ### Windows
            - **.exe** (Installateur NSIS) — `Academia-Helm-${{ github.ref_name }}-windows-setup.exe`
            - **.msi** (Windows Installer) — `Academia-Helm-${{ github.ref_name }}-windows.msi`

            ### macOS
            - **.dmg** (Disk Image) — `Academia-Helm-${{ github.ref_name }}-macos.dmg`

            ---
            Page de téléchargement : https://app.academiahelm.com/downloads
