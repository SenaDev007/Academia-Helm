name: Build Desktop App (Tauri)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web-app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install web-app dependencies
        run: |
          cd apps/web-app
          npm ci

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0"

      - name: Build desktop app
        run: |
          cd apps/desktop
          cargo tauri build
        env:
          NEXT_PUBLIC_API_URL: https://api.academiahelm.com/api
          NEXT_PUBLIC_APP_URL: https://app.academiahelm.com

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: academia-helm-windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web-app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install web-app dependencies
        run: |
          cd apps/web-app
          npm ci

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0"

      - name: Build desktop app
        run: |
          cd apps/desktop
          cargo tauri build
        env:
          NEXT_PUBLIC_API_URL: https://api.academiahelm.com/api
          NEXT_PUBLIC_APP_URL: https://app.academiahelm.com

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: academia-helm-macos
          path: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/macos/*.app

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/academia-helm-windows/**/*.msi
            artifacts/academia-helm-windows/**/*.exe
            artifacts/academia-helm-macos/**/*.dmg
          generate_release_notes: true
          draft: false
          prerelease: false
