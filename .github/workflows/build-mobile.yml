name: Build Mobile App (Flutter)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'

      - name: Disable analytics
        run: flutter config --no-analytics

      - name: Install dependencies
        run: |
          cd apps/mobile-app
          flutter pub get

      - name: Generate code (freezed/json_serializable)
        run: |
          cd apps/mobile-app
          dart run build_runner build --delete-conflicting-outputs

      - name: Build APK (release)
        run: |
          cd apps/mobile-app
          flutter build apk --release \
            --dart-define=API_BASE_URL=https://api.academiahelm.com/api

      - name: Rename APK with version
        run: |
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="dev-$(date +%Y%m%d%H%M%S)"
          fi

          cd apps/mobile-app/build/app/outputs/flutter-apk
          if [ -f app-release.apk ]; then
            cp app-release.apk "Academia-Helm-${VERSION}-android.apk"
          fi

          echo "=== APK généré ==="
          ls -la *.apk 2>/dev/null

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: academia-helm-android-apk
          path: apps/mobile-app/build/app/outputs/flutter-apk/Academia-Helm-*.apk

  release:
    needs: [build-android]
    runs-on: self-hosted
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/academia-helm-android-apk/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
