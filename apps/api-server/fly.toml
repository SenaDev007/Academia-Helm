# fly.toml — Configuration Fly.io pour academia-helm-api
# ============================================================================
# Empêche le cold start en gardant la machine toujours active.
# ⭐ auto_stop_machines = false → la machine ne s'arrête JAMAIS, même sans trafic.
# ⭐ min_machines_running = 1 → au moins 1 machine toujours en marche.
# ============================================================================

app = "academia-helm-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[http_service.concurrency]
  type = "requests"
  hard_limit = 250
  soft_limit = 200

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

[deploy]
  strategy = "rolling"

[env]
  NODE_ENV = "production"
