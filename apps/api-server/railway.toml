# ============================================================================
# Railway Configuration — Academia Helm API
# ============================================================================
# Railway utilise le Dockerfile existant. Ce fichier configure les variables
# d'environnement et le healthcheck.
# ============================================================================

[deploy]
  # Railway utilise le Dockerfile à la racine du dossier apps/api-server
  # Le Dockerfile existe déjà et est compatible Railway
  startCommand = "node --max-old-space-size=1536 dist/main.js"
  healthcheckPath = "/health"
  # ⚠️ 60s (was 30s) — l'app démarre plus lentement maintenant que Neon
  # auto-suspend le compute. Le 1er SELECT après suspend prend ~2-3s (cold start
  # pooler) au lieu de <100ms (warm). Avec prisma migrate deploy + CREATE TABLE
  # IF NOT EXISTS × 20 au démarrage, 30s n'était plus suffisant.
  healthcheckTimeout = 60
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 3

# Variables d'environnement à configurer sur Railway :
# (à set via `railway variables set` ou le dashboard Railway)
#
# OBLIGATOIRES :
#   DATABASE_URL=postgresql://neondb_owner:npg_Nio3WadxL0qb@ep-curly-frost-agx7owra-pooler.c-2.eu-central-1.aws.neon.tech/AcademiaHelm?sslmode=require&channel_binding=require
#   JWT_SECRET=<votre-secret-jwt-32-chars-min>
#   NODE_ENV=production
#   PORT=3000
