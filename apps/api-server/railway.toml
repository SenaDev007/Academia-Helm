# STORAGE — Cloudflare R2 (OBJECT STORAGE pour logos, PDF, images, documents) :
#   STORAGE_TYPE=r2
#   S3_ACCESS_KEY_ID=<r2-access-key-id>
#   S3_SECRET_ACCESS_KEY=<r2-secret-access-key>
#   S3_BUCKET=academia-helm-releases
#   S3_ENDPOINT=https://151a2a130fbe6fcc2998740587b72b1b.r2.cloudflarestorage.com
#   S3_PUBLIC_URL=https://downloads.academiahelm.com
#   S3_REGION=auto
#
# ⚡ Auto-migration au démarrage :
#   Lorsque STORAGE_TYPE=r2, le StorageMigrationService scanne automatiquement
#   les tables tenant_identity_profiles.logoUrl et schools.logo au démarrage
#   (après 30s de délai pour ne pas ralentir le bootstrap) et migre toute
#   entrée base64 vers R2. Aucune intervention manuelle requise.
#   Désactivé automatiquement si STORAGE_TYPE != 'r2'/'s3'.
