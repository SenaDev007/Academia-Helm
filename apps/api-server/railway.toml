# ============================================================================
# Railway Configuration — Academia Helm API
# ============================================================================
# Railway utilise le Dockerfile existant. Ce fichier configurre les variables
# d'environnement et le healthcheck.
# ============================================================================

[deploy]
  # Railway utilise le Dockerfile à la racine du dossier apps/api-server
  # Le Dockerfile existe déjà et est compatible Railway
  startCommand = "node --max-old-space-size=1536 dist/main.js"
  healthcheckPath = "/health"
  healthcheckTimeout = 30
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 3

# Variables d'environnement à configurer sur Railway :
