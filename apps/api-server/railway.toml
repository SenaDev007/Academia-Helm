[deploy]
  [deploy.healthcheck]
    type = "http"
    port = 3000
    path = "/health"
    grace_period = 300

[env]
  # ⭐ 2026-10-16 — FIX CRASH OOM BOOT : harmonisé avec le CMD du Dockerfile
  #    (--max-old-space-size=2048). L'ancienne valeur 768 entrait en conflit
  #    avec le CMD (les flags CLI priment, mais l'incohérence prêtait à
  #    confusion). Le heap réel consommé au boot est désormais maîtrisé par
  #    la DÉDUPLICATION des instances PrismaService (une seule instance
  #    @Global : 7 instances chargeaient chacune le client Prisma 536
  #    modèles + un Pool pg → « Reached heap limit » à 1533 MB, crash-loop).
  NODE_OPTIONS = "--max-old-space-size=2048"
