name: academia_community
description: "Academia Community — Application mobile de l'espace communautaire Academia Helm (canaux par école, groupes, lives & formations)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

# ⚠️ Versions STRICTES alignées sur yeshua-connect-mobile / academia_helm_mobile
# (flutter_riverpod 2.5.1, go_router 14.2.0, dio 5.4.3+1) — mêmes plages que
# les apps Flutter existantes du compte, builds reproductibles.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Gestion d'état
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # HTTP + JWT Bearer (pas de cookies — l'API communauté renvoie un token)
  dio: ^5.4.3+1

  # Persistance légère (token de session)
  shared_preferences: ^2.3.2

  # UI
  cached_network_image: ^3.3.1
  intl: '>=0.19.0 <0.21.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
