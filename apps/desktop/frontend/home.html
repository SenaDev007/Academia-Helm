<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia Helm — Accueil</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100vh; overflow: hidden; font-family: 'Inter', -apple-system, sans-serif; }
        body { display: flex; flex-direction: column; position: relative; }

        /* ── Minimal navbar ── */
        .navbar { background: linear-gradient(135deg, #071D4A 0%, #0B2F73 100%); padding: 10px 24px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
        .nav-left { display: flex; align-items: center; gap: 12px; }
        .nav-logo { width: 32px; height: 32px; border-radius: 6px; }
        .nav-logo img { width: 32px; height: 32px; object-fit: contain; }
        .nav-title { color: white; font-size: 16px; font-weight: 700; }
        .nav-right { display: flex; align-items: center; gap: 8px; }
        .nav-btn { padding: 6px 14px; font-size: 12px; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px; }
        .nav-btn-app { background: linear-gradient(135deg, #F5B335, #FCD779); color: #0B2F73; }
        .nav-btn-app:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(245,179,53,0.3); }
        .nav-badge { padding: 4px 10px; font-size: 11px; font-weight: 600; border-radius: 20px; }
        .nav-badge.online { background: rgba(34,197,94,0.2); color: #4ade80; }
        .nav-badge.offline { background: rgba(245,179,53,0.2); color: #F5B335; }
        .nav-badge-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
        .nav-badge.online .nav-badge-dot { background: #4ade80; }
        .nav-badge.offline .nav-badge-dot { background: #F5B335; }

        /* ── Hero section ── */
        .hero { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        .hero-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: url('icons/ah-background.jpg'); background-size: cover; background-position: center; }
        .hero-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, rgba(7,29,74,0.85) 0%, rgba(11,47,115,0.75) 50%, rgba(26,63,139,0.80) 100%); }
        .hero-content { position: relative; z-index: 2; text-align: center; max-width: 600px; padding: 40px; }
        .hero-logo { width: 90px; height: 90px; margin: 0 auto 24px; background: rgba(255,255,255,0.12); border-radius: 18px; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.2); }
        .hero-logo img { width: 64px; height: 64px; object-fit: contain; }
        .hero-title { font-size: 36px; font-weight: 800; color: white; margin-bottom: 8px; letter-spacing: -0.5px; }
        .hero-tagline { font-size: 18px; color: #F5B335; margin-bottom: 32px; }
        .hero-desc { font-size: 15px; color: rgba(255,255,255,0.7); margin-bottom: 32px; line-height: 1.6; }
        .hero-actions { display: flex; gap: 12px; justify-content: center; }
        .btn-primary { padding: 14px 36px; font-size: 16px; font-weight: 600; color: #0B2F73; background: linear-gradient(135deg, #F5B335 0%, #FCD779 100%); border: none; border-radius: 10px; cursor: pointer; transition: all 0.3s; box-shadow: 0 4px 16px rgba(245,179,53,0.4); text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(245,179,53,0.5); }
        .btn-secondary { padding: 14px 28px; font-size: 14px; font-weight: 600; color: white; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; cursor: pointer; transition: all 0.3s; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
        .btn-secondary:hover { background: rgba(255,255,255,0.15); }
        .btn-sync { padding: 6px 14px; font-size: 12px; font-weight: 600; color: #0B2F73; background: rgba(255,255,255,0.9); border: none; border-radius: 8px; cursor: pointer; }
        .btn-sync:hover { background: white; }
        .btn-sync:disabled { opacity: 0.5; cursor: not-allowed; }
        .footer { position: absolute; bottom: 12px; left: 0; right: 0; text-align: center; z-index: 2; font-size: 11px; color: rgba(255,255,255,0.3); }
    </style>
</head>
<body>
    <!-- Minimal navbar -->
    <div class="navbar">
        <div class="nav-left">
            <div class="nav-logo"><img src="icons/logo-academia-helm.png" alt="AH"></div>
            <span class="nav-title">Academia Helm</span>
        </div>
        <div class="nav-right">
            <div id="statusBadge" class="nav-badge online"><span class="nav-badge-dot"></span> <span id="statusText">En ligne</span></div>
            <button class="btn-sync" id="syncBtn" onclick="triggerSync()">↻ Sync</button>
            <button class="nav-btn nav-btn-app" onclick="window.location.href='app.html'">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                Application
            </button>
        </div>
    </div>

    <!-- Hero section (reproduces web landing hero, but local) -->
    <div class="hero">
        <div class="hero-bg"></div>
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <div class="hero-logo"><img src="icons/logo-academia-helm.png" alt="Academia Helm"></div>
            <h1 class="hero-title">Academia Helm</h1>
            <p class="hero-tagline">Plateforme de pilotage éducatif</p>
            <p class="hero-desc">
                Prenez le gouvernail de votre institution.<br>
                Gérez vos élèves, finances, pédagogie, communication et plus encore.
            </p>
            <div class="hero-actions">
                <a href="app.html" class="btn-primary">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                    Accéder à l'application
                </a>
                <a href="portal-select.html" class="btn-secondary">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                    Changer de portail
                </a>
            </div>
        </div>
        <div class="footer">© 2026 YEHI OR Tech — Academia Helm</div>
    </div>

    <script>
        let isOnline = navigator.onLine;

        function updateStatus() {
            const badge = document.getElementById('statusBadge');
            const text = document.getElementById('statusText');
            if (isOnline) {
                badge.className = 'nav-badge online';
                text.textContent = 'En ligne';
            } else {
                badge.className = 'nav-badge offline';
                text.textContent = 'Hors ligne';
            }
        }

        async function triggerSync() {
            const btn = document.getElementById('syncBtn');
            btn.disabled = true;
            btn.textContent = '↻ Sync...';
            try {
                if (window.__TAURI__?.core?.invoke) {
                    await window.__TAURI__.core.invoke('trigger_sync');
                }
            } catch(e) { console.log('Sync error:', e); }
            btn.disabled = false;
            btn.textContent = '↻ Sync';
        }

        window.addEventListener('online', () => { isOnline = true; updateStatus(); });
        window.addEventListener('offline', () => { isOnline = false; updateStatus(); });

        updateStatus();
    </script>
</body>
</html>
