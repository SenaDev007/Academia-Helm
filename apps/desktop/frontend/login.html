<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia Helm — Connexion</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100vh; overflow: hidden; font-family: 'Inter', -apple-system, sans-serif; }
        body { display: flex; align-items: center; justify-content: center; position: relative; }
        .bg-image { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: url('icons/ah-background.jpg'); background-size: cover; background-position: center; z-index: 0; }
        .bg-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, rgba(7,29,74,0.90) 0%, rgba(11,47,115,0.85) 50%, rgba(26,63,139,0.88) 100%); z-index: 1; }
        .container { position: relative; z-index: 2; width: 400px; padding: 40px; }
        .logo-wrapper { width: 80px; height: 80px; margin: 0 auto 20px; background: rgba(255,255,255,0.12); border-radius: 16px; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.2); }
        .logo-wrapper img { width: 56px; height: 56px; object-fit: contain; }
        .title { text-align: center; color: white; font-size: 24px; font-weight: 700; margin-bottom: 4px; }
        .tagline { text-align: center; color: #F5B335; font-size: 13px; margin-bottom: 32px; }
        .card { background: rgba(255,255,255,0.08); backdrop-filter: blur(10px); border-radius: 16px; padding: 24px; border: 1px solid rgba(255,255,255,0.1); }
        .label { color: rgba(255,255,255,0.7); font-size: 13px; margin-bottom: 6px; display: block; }
        .input { width: 100%; padding: 12px 16px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); border-radius: 10px; color: white; font-size: 15px; margin-bottom: 16px; outline: none; transition: border 0.2s; }
        .input:focus { border-color: #F5B335; }
        .input::placeholder { color: rgba(255,255,255,0.3); }
        .btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #F5B335, #FCD779); color: #0B2F73; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(245,179,53,0.3); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .offline-msg { background: rgba(245,179,53,0.15); border: 1px solid rgba(245,179,53,0.3); border-radius: 10px; padding: 12px 16px; margin-bottom: 16px; font-size: 13px; color: #F5B335; }
        .back-link { text-align: center; margin-top: 16px; }
        .back-link a { color: rgba(255,255,255,0.5); font-size: 13px; text-decoration: none; cursor: pointer; }
        .back-link a:hover { color: #F5B335; }
        .footer { position: absolute; bottom: 16px; left: 0; right: 0; text-align: center; z-index: 2; font-size: 11px; color: rgba(255,255,255,0.3); }
    </style>
</head>
<body>
    <div class="bg-image"></div>
    <div class="bg-overlay"></div>

    <div class="container">
        <div class="logo-wrapper"><img src="icons/logo-academia-helm.png" alt="AH"></div>
        <h1 class="title">Academia Helm</h1>
        <p class="tagline">Connexion</p>

        <div class="card">
            <div id="offlineMsg" class="offline-msg" style="display:none;">
                ⚠ Mode hors ligne — Vous devez être connecté à Internet pour vous connecter la première fois.
            </div>

            <label class="label">Email</label>
            <input type="email" class="input" id="email" placeholder="votre@email.com" value="">

            <label class="label">Mot de passe</label>
            <input type="password" class="input" id="password" placeholder="••••••••">

            <button class="btn" id="loginBtn" onclick="doLogin()">Se connecter</button>
        </div>

        <div class="back-link">
            <a href="splash.html">← Retour</a>
        </div>
    </div>

    <div class="footer">© 2026 YEHI OR Tech — Academia Helm</div>

    <script>
        let isOnline = navigator.onLine;

        // Check if we have a cached session
        async function checkCachedSession() {
            try {
                if (window.__TAURI__) {
                    const { Store } = window.__TAURI__.store;
                    const store = await Store.load('academia-helm-store.json');
                    const session = await store.get('userSession');
                    if (session && session.token) {
                        // Session cached — go directly to app
                        window.location.href = 'app.html';
                        return;
                    }
                }
            } catch(e) { console.log('No cached session'); }

            // No cached session — show login
            if (!isOnline) {
                document.getElementById('offlineMsg').style.display = 'block';
                document.getElementById('loginBtn').disabled = true;
                document.getElementById('loginBtn').textContent = 'Connexion Internet requise';
            }
        }

        async function doLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (!email || !password) return;

            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.textContent = 'Connexion...';

            try {
                // Call the API
                const response = await fetch('https://api.academiahelm.com/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                if (!response.ok) throw new Error('Login failed');

                const data = await response.json();

                // Cache the session in Tauri store
                if (window.__TAURI__) {
                    const { Store } = window.__TAURI__.store;
                    const store = await Store.load('academia-helm-store.json');
                    await store.set('userSession', {
                        token: data.accessToken || data.access_token,
                        user: data.user,
                        loginAt: new Date().toISOString()
                    });
                    await store.save();
                }

                // Go to app
                window.location.href = 'app.html';

            } catch(e) {
                btn.disabled = false;
                btn.textContent = 'Se connecter';
                alert('Erreur de connexion: ' + e.message);
            }
        }

        window.addEventListener('online', () => {
            isOnline = true;
            document.getElementById('offlineMsg').style.display = 'none';
            document.getElementById('loginBtn').disabled = false;
            document.getElementById('loginBtn').textContent = 'Se connecter';
        });

        window.addEventListener('offline', () => {
            isOnline = false;
            if (!window.__TAURI__) {
                document.getElementById('offlineMsg').style.display = 'block';
                document.getElementById('loginBtn').disabled = true;
                document.getElementById('loginBtn').textContent = 'Connexion Internet requise';
            }
        });

        checkCachedSession();
    </script>
</body>
</html>
