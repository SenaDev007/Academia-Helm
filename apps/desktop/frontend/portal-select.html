<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia Helm — Portail</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100vh; overflow: hidden; font-family: 'Inter', -apple-system, sans-serif; }
        body { display: flex; align-items: center; justify-content: center; position: relative; }
        .bg-image { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: url('icons/ah-background.jpg'); background-size: cover; background-position: center; z-index: 0; }
        .bg-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, rgba(7,29,74,0.90) 0%, rgba(11,47,115,0.85) 50%, rgba(26,63,139,0.88) 100%); z-index: 1; }
        .container { position: relative; z-index: 2; width: 600px; padding: 40px; text-align: center; }
        .logo-wrapper { width: 80px; height: 80px; margin: 0 auto 20px; background: rgba(255,255,255,0.12); border-radius: 16px; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.2); }
        .logo-wrapper img { width: 56px; height: 56px; object-fit: contain; }
        .title { color: white; font-size: 24px; font-weight: 700; margin-bottom: 4px; }
        .tagline { color: #F5B335; font-size: 13px; margin-bottom: 32px; }
        .portals { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .portal-card { background: rgba(255,255,255,0.08); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 24px; cursor: pointer; transition: all 0.3s; text-align: center; }
        .portal-card:hover { background: rgba(255,255,255,0.12); transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,0.2); }
        .portal-icon { width: 56px; height: 56px; margin: 0 auto 12px; border-radius: 14px; display: flex; align-items: center; justify-content: center; }
        .portal-icon svg { width: 28px; height: 28px; }
        .portal-title { color: white; font-size: 16px; font-weight: 600; margin-bottom: 4px; }
        .portal-desc { color: rgba(255,255,255,0.5); font-size: 12px; }
        .footer { position: absolute; bottom: 16px; left: 0; right: 0; text-align: center; z-index: 2; font-size: 11px; color: rgba(255,255,255,0.3); }
        .back-link { margin-top: 24px; }
        .back-link a { color: rgba(255,255,255,0.5); font-size: 13px; text-decoration: none; cursor: pointer; }
        .back-link a:hover { color: #F5B335; }
    </style>
</head>
<body>
    <div class="bg-image"></div>
    <div class="bg-overlay"></div>

    <div class="container">
        <div class="logo-wrapper"><img src="icons/logo-academia-helm.png" alt="AH"></div>
        <h1 class="title">Academia Helm</h1>
        <p class="tagline">Choisissez votre portail</p>

        <div class="portals">
            <div class="portal-card" onclick="selectPortal('school')">
                <div class="portal-icon" style="background: rgba(11,47,115,0.5);">
                    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M3 21h18M5 21V7l8-4v18M19 21V11l-6-4"/></svg>
                </div>
                <div class="portal-title">École</div>
                <div class="portal-desc">Direction, administration</div>
            </div>
            <div class="portal-card" onclick="selectPortal('teacher')">
                <div class="portal-icon" style="background: rgba(29,79,165,0.5);">
                    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
                </div>
                <div class="portal-title">Enseignant</div>
                <div class="portal-desc">Pédagogie, classes</div>
            </div>
            <div class="portal-card" onclick="selectPortal('parent')">
                <div class="portal-icon" style="background: rgba(245,179,53,0.3);">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#F5B335" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </div>
                <div class="portal-title">Parent</div>
                <div class="portal-desc">Suivi des enfants</div>
            </div>
            <div class="portal-card" onclick="selectPortal('public')">
                <div class="portal-icon" style="background: rgba(100,116,139,0.3);">
                    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                </div>
                <div class="portal-title">Public</div>
                <div class="portal-desc">Pré-inscription</div>
            </div>
        </div>

        <div class="back-link">
            <a onclick="window.location.href='app.html'">← Retour à l'accueil</a>
        </div>
    </div>

    <div class="footer">© 2026 YEHI OR Tech — Academia Helm</div>

    <script>
        async function selectPortal(portal) {
            // Save selected portal
            try {
                if (window.__TAURI__) {
                    const { Store } = window.__TAURI__.store;
                    const store = await Store.load('academia-helm-store.json');
                    await store.set('selectedPortal', portal);
                    await store.save();
                }
            } catch(e) {}

            // Go to app with portal selected
            window.location.href = 'app.html?portal=' + portal;
        }
    </script>
</body>
</html>
