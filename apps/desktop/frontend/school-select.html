<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia Helm — École</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100vh; overflow: hidden; font-family: 'Inter', -apple-system, sans-serif; }
        body { display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #071D4A 0%, #0B2F73 50%, #1A3F8B 100%); }
        .container { width: 500px; padding: 40px; }
        .logo-wrapper { width: 80px; height: 80px; margin: 0 auto 20px; background: rgba(255,255,255,0.12); border-radius: 16px; display: flex; align-items: center; justify-content: center; }
        .logo-wrapper img { width: 56px; height: 56px; object-fit: contain; }
        .title { text-align: center; color: white; font-size: 24px; font-weight: 700; margin-bottom: 4px; }
        .tagline { text-align: center; color: #F5B335; font-size: 13px; margin-bottom: 24px; }
        .card { background: rgba(255,255,255,0.08); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 24px; }
        .label { color: rgba(255,255,255,0.7); font-size: 13px; margin-bottom: 6px; display: block; }
        .input { width: 100%; padding: 12px 16px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); border-radius: 10px; color: white; font-size: 15px; margin-bottom: 16px; outline: none; }
        .input:focus { border-color: #F5B335; }
        .btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #F5B335, #FCD779); color: #0B2F73; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; }
        .school-list { max-height: 300px; overflow-y: auto; margin-bottom: 16px; }
        .school-item { padding: 12px 16px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; margin-bottom: 8px; cursor: pointer; transition: all 0.2s; color: white; }
        .school-item:hover { background: rgba(255,255,255,0.1); border-color: #F5B335; }
        .school-name { font-weight: 600; font-size: 15px; }
        .school-city { font-size: 12px; color: rgba(255,255,255,0.5); }
        .back-link { text-align: center; margin-top: 16px; }
        .back-link a { color: rgba(255,255,255,0.5); font-size: 13px; text-decoration: none; cursor: pointer; }
        .back-link a:hover { color: #F5B335; }
        .loading { text-align: center; color: rgba(255,255,255,0.5); padding: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-wrapper"><img src="icons/logo-academia-helm.png" alt="AH"></div>
        <h1 class="title">Academia Helm</h1>
        <p class="tagline">Trouvez votre école</p>

        <div class="card">
            <label class="label">Rechercher</label>
            <input type="text" class="input" id="searchInput" placeholder="Nom de l'école, ville..." oninput="searchSchools()">

            <div id="schoolList" class="school-list">
                <div class="loading">Tapez pour rechercher...</div>
            </div>

            <button class="btn" id="continueBtn" disabled onclick="selectSchool()">Continuer →</button>
        </div>

        <div class="back-link"><a onclick="window.location.href='splash.html'">← Retour</a></div>
    </div>

    <script>
        let allSchools = [];
        let selectedSchool = null;

        async function loadSchools() {
            const list = document.getElementById('schoolList');
            list.innerHTML = '<div class="loading">Chargement des écoles...</div>';

            try {
                const response = await fetch('https://api.academiahelm.com/api/public/schools/list');
                if (!response.ok) throw new Error('API error');
                allSchools = await response.json();
                displaySchools(allSchools);
            } catch(e) {
                list.innerHTML = '<div class="loading">Erreur de chargement. Vérifiez votre connexion.</div>';
            }
        }

        function searchSchools() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allSchools.filter(s =>
                (s.name || '').toLowerCase().includes(query) ||
                (s.city || '').toLowerCase().includes(query)
            );
            displaySchools(filtered);
        }

        function displaySchools(schools) {
            const list = document.getElementById('schoolList');
            if (schools.length === 0) {
                list.innerHTML = '<div class="loading">Aucune école trouvée</div>';
                return;
            }
            list.innerHTML = schools.map(s => `
                <div class="school-item" onclick="pickSchool('${s.id}', '${(s.name||'').replace(/'/g, "\\'")}', '${s.slug||''}')">
                    <div class="school-name">${s.name || 'École sans nom'}</div>
                    <div class="school-city">${[s.city, s.country].filter(Boolean).join(', ') || ''}</div>
                </div>
            `).join('');
        }

        function pickSchool(id, name, slug) {
            selectedSchool = { id, name, slug };
            document.querySelectorAll('.school-item').forEach(el => el.style.borderColor = 'rgba(255,255,255,0.1)');
            event.target.closest('.school-item').style.borderColor = '#F5B335';
            document.getElementById('continueBtn').disabled = false;
        }

        async function selectSchool() {
            if (!selectedSchool) return;

            try {
                if (window.__TAURI__) {
                    const { Store } = window.__TAURI__.store;
                    const store = await Store.load('academia-helm-store.json');
                    await store.set('selectedSchool', selectedSchool);
                    await store.save();
                }
            } catch(e) {}

            // Go to sync page
            window.location.href = 'sync.html';
        }

        loadSchools();
    </script>
</body>
</html>
