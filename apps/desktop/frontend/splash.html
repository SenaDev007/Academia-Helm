<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia Helm — Connexion</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #071D4A 0%, #0B2F73 50%, #1A3F8B 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* ── Main content ── */
        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            color: white;
            max-width: 500px;
            padding: 40px;
        }

        /* ── Logo (smaller, elegant) ── */
        .logo-wrapper {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .logo-wrapper img {
            width: 56px;
            height: 56px;
            object-fit: contain;
        }

        /* ── Title ── */
        .app-name {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            color: #FFFFFF;
        }
        .tagline {
            font-size: 15px;
            font-weight: 400;
            color: #F5B335;
            margin-bottom: 40px;
        }

        /* ── Connect button ── */
        .btn-connect {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 36px;
            font-size: 16px;
            font-weight: 600;
            color: #0B2F73;
            background: linear-gradient(135deg, #F5B335 0%, #FCD779 100%);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(245, 179, 53, 0.4);
            text-decoration: none;
        }
        .btn-connect:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(245, 179, 53, 0.5);
        }
        .btn-connect:active {
            transform: translateY(0);
        }
        .btn-connect svg {
            width: 18px;
            height: 18px;
        }

        /* ── Secondary link ── */
        .secondary-link {
            display: block;
            margin-top: 20px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            transition: color 0.2s;
        }
        .secondary-link:hover {
            color: #F5B335;
        }

        /* ── Footer ── */
        .footer {
            position: absolute;
            bottom: 16px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 2;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.35);
        }
    </style>
</head>
<body>
    <!-- Main content (shown immediately, no loading delay) -->
    <div class="container">
        <!-- Logo (smaller) -->
        <div class="logo-wrapper">
            <img src="icons/logo-academia-helm.png" alt="Academia Helm">
        </div>

        <!-- Title -->
        <h1 class="app-name">Academia Helm</h1>
        <p class="tagline">Plateforme de pilotage éducatif</p>

        <!-- Connect button -->
        <a href="https://app.academiahelm.com/login" class="btn-connect">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                <polyline points="10 17 15 12 10 7"/>
                <line x1="15" y1="12" x2="3" y2="12"/>
            </svg>
            Se connecter à mon école
        </a>

        <!-- Secondary link -->
        <a href="https://academiahelm.com" class="secondary-link">
            Découvrir Academia Helm →
        </a>
    </div>

    <!-- Footer -->
    <div class="footer">
        © 2026 YEHI OR Tech — Academia Helm
    </div>
</body>
</html>
