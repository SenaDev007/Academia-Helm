<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia Helm</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100vh; overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background-color: #071D4A;
            display: flex; align-items: center; justify-content: center;
            position: relative;
        }
        .bg-image {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('icons/ah-background.jpg');
            background-size: cover; background-position: center; background-repeat: no-repeat;
            z-index: 0;
        }
        .bg-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(7,29,74,0.85) 0%, rgba(11,47,115,0.75) 50%, rgba(26,63,139,0.80) 100%);
            z-index: 1;
        }
        .container {
            position: relative; z-index: 2; text-align: center; color: white;
            max-width: 500px; padding: 40px;
        }
        .logo-wrapper {
            width: 90px; height: 90px; margin: 0 auto 24px;
            background: rgba(255,255,255,0.12); border-radius: 18px;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(8px);
        }
        .logo-wrapper img { width: 64px; height: 64px; object-fit: contain; }
        .app-name {
            font-size: 30px; font-weight: 700; letter-spacing: -0.5px;
            margin-bottom: 8px; color: #FFFFFF;
            text-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }
        .tagline {
            font-size: 16px; font-weight: 400; color: #F5B335;
            margin-bottom: 32px; text-shadow: 0 1px 4px rgba(0,0,0,0.4);
        }

        /* ── Status badge ── */
        .status-badge {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 6px 14px; font-size: 12px; font-weight: 600;
            border-radius: 20px; margin-bottom: 24px;
        }
        .status-online {
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }
        .status-offline {
            background: rgba(245, 179, 53, 0.2);
            color: #F5B335;
            border: 1px solid rgba(245, 179, 53, 0.3);
        }
        .status-dot {
            width: 8px; height: 8px; border-radius: 50%;
        }
        .status-online .status-dot { background: #4ade80; }
        .status-offline .status-dot { background: #F5B335; }

        /* ── School info (when saved) ── */
        .school-info {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
        }
        .school-label {
            font-size: 11px; color: rgba(255,255,255,0.5);
            text-transform: uppercase; letter-spacing: 1px;
            margin-bottom: 4px;
        }
        .school-name {
            font-size: 18px; font-weight: 600; color: #FFFFFF;
        }

        /* ── Buttons ── */
        .btn-primary {
            display: inline-flex; align-items: center; gap: 10px;
            padding: 14px 36px; font-size: 16px; font-weight: 600;
            color: #0B2F73;
            background: linear-gradient(135deg, #F5B335 0%, #FCD779 100%);
            border: none; border-radius: 10px; cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(245,179,53,0.4);
            text-decoration: none;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(245,179,53,0.5); }
        .btn-primary:active { transform: translateY(0); }
        .btn-primary:disabled {
            opacity: 0.5; cursor: not-allowed; transform: none;
        }
        .btn-primary svg { width: 18px; height: 18px; }

        .btn-secondary {
            display: block; margin: 16px auto 0; font-size: 13px;
            color: rgba(255,255,255,0.6); text-decoration: none;
            transition: color 0.2s; cursor: pointer; background: none;
            border: none; font-family: inherit;
        }
        .btn-secondary:hover { color: #F5B335; }

        /* ── Offline notice ── */
        .offline-notice {
            background: rgba(245, 179, 53, 0.1);
            border: 1px solid rgba(245, 179, 53, 0.25);
            border-radius: 10px;
            padding: 14px 20px;
            margin: 20px 0;
            font-size: 13px;
            color: rgba(255,255,255,0.8);
            line-height: 1.6;
            text-align: left;
        }
        .offline-notice strong { color: #F5B335; }

        .footer {
            position: absolute; bottom: 16px; left: 0; right: 0;
            text-align: center; z-index: 2; font-size: 11px;
            color: rgba(255,255,255,0.4);
        }

        /* ── Loading ── */
        .loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #071D4A 0%, #0B2F73 50%, #1A3F8B 100%);
            z-index: 9999;
            display: flex; align-items: center; justify-content: center;
            transition: opacity 0.3s;
        }
        .loading-screen.hidden { opacity: 0; pointer-events: none; }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(255,255,255,0.2);
            border-top-color: #F5B335;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <!-- Loading screen while checking Tauri store -->
    <div class="loading-screen" id="loadingScreen">
        <div class="spinner"></div>
    </div>

    <div class="bg-image"></div>
    <div class="bg-overlay"></div>

    <div class="container" id="mainContent" style="display: none;">
        <div class="logo-wrapper">
            <img src="icons/logo-academia-helm.png" alt="Academia Helm">
        </div>
        <h1 class="app-name">Academia Helm</h1>
        <p class="tagline">Plateforme de pilotage éducatif</p>

        <!-- Status badge -->
        <div id="statusBadge"></div>

        <!-- School info (shown if school is saved) -->
        <div id="schoolInfo" style="display: none;" class="school-info">
            <div class="school-label">Dernière école utilisée</div>
            <div class="school-name" id="schoolName">—</div>
        </div>

        <!-- Offline notice (shown when offline and no school saved) -->
        <div id="offlineNotice" style="display: none;" class="offline-notice">
            <strong>⚠ Mode hors ligne</strong><br>
            La première connexion nécessite une connexion Internet pour rechercher
            votre école. Une fois connecté, l'application fonctionnera hors ligne
            grâce au cache local.
        </div>

        <!-- Primary button (dynamic) -->
        <div id="buttonArea"></div>

        <!-- Secondary actions -->
        <div id="secondaryActions"></div>
    </div>

    <div class="footer">© 2026 YEHI OR Tech — Academia Helm</div>

    <script>
        // ── Configuration ──
        const APP_BASE = 'https://app.academiahelm.com';
        const STORE_FILE = 'academia-helm-store.json';
        const STORE_KEY_SCHOOL = 'selectedSchool';

        // ── State ──
        let savedSchool = null;
        let isOnline = navigator.onLine;

        // ── Initialize ──
        async function init() {
            try {
                // Check if Tauri global API is available
                if (window.__TAURI__) {
                    const { Store } = window.__TAURI__.store;
                    if (Store) {
                        const store = await Store.load(STORE_FILE);
                        savedSchool = await store.get(STORE_KEY_SCHOOL);
                    }
                }
            } catch (e) {
                console.log('Tauri store not available:', e);
            }

            // Show main content
            document.getElementById('loadingScreen').classList.add('hidden');
            document.getElementById('mainContent').style.display = 'block';

            renderUI();
        }

        // ── Render UI based on state ──
        function renderUI() {
            const statusBadge = document.getElementById('statusBadge');
            const schoolInfo = document.getElementById('schoolInfo');
            const offlineNotice = document.getElementById('offlineNotice');
            const buttonArea = document.getElementById('buttonArea');
            const secondaryActions = document.getElementById('secondaryActions');

            // Status badge
            if (isOnline) {
                statusBadge.innerHTML = '<div class="status-badge status-online"><div class="status-dot"></div>En ligne</div>';
            } else {
                statusBadge.innerHTML = '<div class="status-badge status-offline"><div class="status-dot"></div>Hors ligne</div>';
            }

            // School info
            if (savedSchool && savedSchool.name) {
                schoolInfo.style.display = 'block';
                document.getElementById('schoolName').textContent = savedSchool.name;
            } else {
                schoolInfo.style.display = 'none';
            }

            // Button + offline notice
            if (savedSchool) {
                // ── School is saved: show "Reprendre" ──
                offlineNotice.style.display = 'none';

                const appUrl = savedSchool.slug
                    ? `${APP_BASE}/app?tenant=${savedSchool.slug}`
                    : `${APP_BASE}/app`;

                buttonArea.innerHTML = `
                    <a href="${appUrl}" class="btn-primary" id="resumeBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                            <polyline points="10 17 15 12 10 7"/>
                            <line x1="15" y1="12" x2="3" y2="12"/>
                        </svg>
                        Reprendre
                    </a>
                `;

                secondaryActions.innerHTML = `
                    <button class="btn-secondary" id="changeSchoolBtn">
                        Changer d'école
                    </button>
                `;

                document.getElementById('changeSchoolBtn').addEventListener('click', function() {
                    window.location.href = `${APP_BASE}/desktop`;
                });

            } else {
                // ── No school saved: show "Se connecter" ──
                if (!isOnline) {
                    offlineNotice.style.display = 'block';
                    buttonArea.innerHTML = `
                        <button class="btn-primary" disabled>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="1" y1="1" x2="23" y2="23"/>
                                <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
                                <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
                            </svg>
                            Connexion Internet requise
                        </button>
                    `;
                } else {
                    buttonArea.innerHTML = `
                        <a href="${APP_BASE}/desktop" class="btn-primary">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                                <polyline points="10 17 15 12 10 7"/>
                                <line x1="15" y1="12" x2="3" y2="12"/>
                            </svg>
                            Se connecter à mon école
                        </a>
                    `;
                }

                secondaryActions.innerHTML = `
                    <a href="https://academiahelm.com" class="btn-secondary">
                        Découvrir Academia Helm →
                    </a>
                `;
            }
        }

        // ── Listen for online/offline events ──
        window.addEventListener('online', function() {
            isOnline = true;
            renderUI();
        });

        window.addEventListener('offline', function() {
            isOnline = false;
            renderUI();
        });

        // ── Listen for school selection from /desktop page ──
        // The /desktop page can save the school via Tauri store when it detects Tauri environment
        // We also check URL params for school slug (passed back from /desktop)
        const urlParams = new URLSearchParams(window.location.search);
        const schoolSlug = urlParams.get('school');
        const schoolName = urlParams.get('name');

        if (schoolSlug && schoolName) {
            // School was just selected, save it
            saveSchool({ slug: schoolSlug, name: schoolName });
        }

        async function saveSchool(school) {
            try {
                if (window.__TAURI__) {
                    const { Store } = window.__TAURI__.store;
                    if (Store) {
                        const store = await Store.load(STORE_FILE);
                        await store.set(STORE_KEY_SCHOOL, school);
                        await store.save();
                        savedSchool = school;
                        renderUI();
                    }
                }
            } catch (e) {
                console.log('Could not save school:', e);
            }
        }

        // ── Start ──
        init();
    </script>
</body>
</html>
