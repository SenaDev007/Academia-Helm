<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia Helm</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100vh; overflow: hidden; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background: linear-gradient(135deg, #071D4A 0%, #0B2F73 50%, #1A3F8B 100%); display: flex; align-items: center; justify-content: center; position: relative; }
        .bg-image { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: url('icons/ah-background.jpg'); background-size: cover; background-position: center; z-index: 0; }
        .bg-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, rgba(7,29,74,0.85) 0%, rgba(11,47,115,0.75) 50%, rgba(26,63,139,0.80) 100%); z-index: 1; }
        .container { position: relative; z-index: 2; text-align: center; color: white; max-width: 500px; padding: 40px; }
        .logo-wrapper { width: 90px; height: 90px; margin: 0 auto 24px; background: rgba(255,255,255,0.12); border-radius: 18px; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.2); }
        .logo-wrapper img { width: 64px; height: 64px; object-fit: contain; }
        .title { font-size: 30px; font-weight: 700; margin-bottom: 8px; text-shadow: 0 2px 8px rgba(0,0,0,0.4); }
        .tagline { font-size: 16px; color: #F5B335; margin-bottom: 32px; }
        .status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; font-size: 12px; font-weight: 600; border-radius: 20px; margin-bottom: 24px; }
        .status-online { background: rgba(34,197,94,0.2); color: #4ade80; border: 1px solid rgba(34,197,94,0.3); }
        .status-offline { background: rgba(245,179,53,0.2); color: #F5B335; border: 1px solid rgba(245,179,53,0.3); }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; }
        .status-online .status-dot { background: #4ade80; }
        .status-offline .status-dot { background: #F5B335; }
        .btn-primary { display: inline-flex; align-items: center; gap: 10px; padding: 14px 36px; font-size: 16px; font-weight: 600; color: #0B2F73; background: linear-gradient(135deg, #F5B335 0%, #FCD779 100%); border: none; border-radius: 10px; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 4px 16px rgba(245,179,53,0.4); text-decoration: none; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(245,179,53,0.5); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary { display: block; margin: 16px auto 0; font-size: 13px; color: rgba(255,255,255,0.6); text-decoration: none; cursor: pointer; background: none; border: none; font-family: inherit; }
        .btn-secondary:hover { color: #F5B335; }
        .footer { position: absolute; bottom: 16px; left: 0; right: 0; text-align: center; z-index: 2; font-size: 11px; color: rgba(255,255,255,0.4); }
        .loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #071D4A 0%, #0B2F73 50%, #1A3F8B 100%); z-index: 9999; display: flex; align-items: center; justify-content: center; transition: opacity 0.3s; }
        .loading-screen.hidden { opacity: 0; pointer-events: none; }
        .spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.2); border-top-color: #F5B335; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .school-info { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 12px; padding: 16px; margin-bottom: 24px; }
        .school-label { font-size: 11px; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        .school-name { font-size: 18px; font-weight: 600; color: #FFFFFF; }
    </style>
</head>
<body>
    <div class="loading-screen" id="loadingScreen"><div class="spinner"></div></div>
    <div class="bg-image"></div>
    <div class="bg-overlay"></div>

    <div class="container" id="mainContent" style="display: none;">
        <div class="logo-wrapper"><img src="icons/logo-academia-helm.png" alt="Academia Helm"></div>
        <h1 class="title">Academia Helm</h1>
        <p class="tagline">Plateforme de pilotage éducatif</p>
        <div id="statusBadge"></div>

        <div id="schoolInfo" style="display: none;" class="school-info">
            <div class="school-label">École connectée</div>
            <div class="school-name" id="schoolName">—</div>
        </div>

        <div id="buttonArea"></div>
        <div id="secondaryActions"></div>
    </div>

    <div class="footer">© 2026 YEHI OR Tech — Academia Helm</div>

    <script>
        // ── ALL URLs are LOCAL (no remote URLs) ──
        const STORE_FILE = 'academia-helm-store.json';
        const STORE_KEY_SCHOOL = 'selectedSchool';
        const STORE_KEY_INITIAL_SYNC = 'initialSyncCompleted';
        const STORE_KEY_SESSION = 'userSession';

        let savedSchool = null;
        let initialSyncCompleted = false;
        let cachedSession = null;
        let isOnline = navigator.onLine;

        async function init() {
            try {
                if (window.__TAURI__) {
                    const { Store } = window.__TAURI__.store;
                    if (Store) {
                        const store = await Store.load(STORE_FILE);
                        savedSchool = await store.get(STORE_KEY_SCHOOL);
                        initialSyncCompleted = await store.get(STORE_KEY_INITIAL_SYNC);
                        cachedSession = await store.get(STORE_KEY_SESSION);
                    }
                }
            } catch (e) { console.log('Tauri store not available:', e); }

            document.getElementById('loadingScreen').classList.add('hidden');
            document.getElementById('mainContent').style.display = 'block';
            renderUI();
        }

        function renderUI() {
            const statusBadge = document.getElementById('statusBadge');
            const schoolInfo = document.getElementById('schoolInfo');
            const buttonArea = document.getElementById('buttonArea');
            const secondaryActions = document.getElementById('secondaryActions');

            // Status badge
            if (isOnline) {
                statusBadge.innerHTML = '<div class="status-badge status-online"><div class="status-dot"></div>En ligne</div>';
            } else {
                statusBadge.innerHTML = '<div class="status-badge status-offline"><div class="status-dot"></div>Hors ligne</div>';
            }

            // Show school info if saved
            if (savedSchool && savedSchool.name) {
                schoolInfo.style.display = 'block';
                document.getElementById('schoolName').textContent = savedSchool.name;
            } else {
                schoolInfo.style.display = 'none';
            }

            if (savedSchool && initialSyncCompleted && cachedSession) {
                // ── School + sync done + session cached → go to app (WORKS OFFLINE) ──
                buttonArea.innerHTML = `
                    <a href="app.html" class="btn-primary">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                            <polyline points="10 17 15 12 10 7"/>
                            <line x1="15" y1="12" x2="3" y2="12"/>
                        </svg>
                        Reprendre
                    </a>
                `;
                secondaryActions.innerHTML = `
                    <button class="btn-secondary" onclick="window.location.href='home.html'">Page d'accueil</button>
                    <button class="btn-secondary" onclick="logout()">Changer d'utilisateur</button>
                `;
            } else if (savedSchool && initialSyncCompleted && !cachedSession) {
                // ── School + sync done but no session → login (WORKS OFFLINE if session was cached before) ──
                buttonArea.innerHTML = `
                    <a href="login.html" class="btn-primary">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                            <polyline points="10 17 15 12 10 7"/>
                            <line x1="15" y1="12" x2="3" y2="12"/>
                        </svg>
                        Se connecter
                    </a>
                `;
                secondaryActions.innerHTML = `
                    <button class="btn-secondary" onclick="window.location.href='home.html'">Page d'accueil</button>
                `;
            } else if (savedSchool && !initialSyncCompleted && isOnline) {
                // ── School selected but no sync → sync needed (ONLINE) ──
                buttonArea.innerHTML = `
                    <a href="sync.html" class="btn-primary">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/>
                            <path d="M21 3v5h-5"/>
                        </svg>
                        Synchroniser les données
                    </a>
                `;
                secondaryActions.innerHTML = `
                    <button class="btn-secondary" onclick="window.location.href='https://app.academiahelm.com/desktop'">Changer d'école</button>
                `;
            } else if (savedSchool && !initialSyncCompleted && !isOnline) {
                // ── School selected, no sync, OFFLINE → need internet ──
                buttonArea.innerHTML = `
                    <button class="btn-primary" disabled>
                        Sync initiale requise (Internet nécessaire)
                    </button>
                `;
                secondaryActions.innerHTML = '';
            } else if (!savedSchool && isOnline) {
                // ── No school, ONLINE → school selection ──
                buttonArea.innerHTML = `
                    <a href="https://app.academiahelm.com/desktop" class="btn-primary">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                            <polyline points="10 17 15 12 10 7"/>
                            <line x1="15" y1="12" x2="3" y2="12"/>
                        </svg>
                        Se connecter à mon école
                    </a>
                `;
                secondaryActions.innerHTML = `
                    <button class="btn-secondary" onclick="window.location.href='home.html'">Découvrir Academia Helm →</button>
                `;
            } else {
                // ── No school, OFFLINE → can't do anything ──
                buttonArea.innerHTML = `
                    <button class="btn-primary" disabled>
                        Connexion Internet requise pour la première utilisation
                    </button>
                `;
                secondaryActions.innerHTML = '';
            }
        }

        async function resetSchool() {
            try {
                if (window.__TAURI__) {
                    const { Store } = window.__TAURI__.store;
                    const store = await Store.load(STORE_FILE);
                    await store.delete(STORE_KEY_SCHOOL);
                    await store.delete(STORE_KEY_INITIAL_SYNC);
                    await store.delete(STORE_KEY_SESSION);
                    await store.save();
                }
            } catch(e) {}
            savedSchool = null;
            initialSyncCompleted = false;
            cachedSession = null;
            renderUI();
        }

        async function logout() {
            try {
                if (window.__TAURI__) {
                    const { Store } = window.__TAURI__.store;
                    const store = await Store.load(STORE_FILE);
                    await store.delete(STORE_KEY_SESSION);
                    await store.save();
                }
            } catch(e) {}
            cachedSession = null;
            renderUI();
        }

        window.addEventListener('online', () => { isOnline = true; renderUI(); });
        window.addEventListener('offline', () => { isOnline = false; renderUI(); });

        // Listen for sync completion
        if (window.__TAURI__?.event?.listen) {
            window.__TAURI__.event.listen('sync-completed', async (event) => {
                if (event.payload?.last_sync_status === 'success') {
                    try {
                        if (window.__TAURI__) {
                            const { Store } = window.__TAURI__.store;
                            const store = await Store.load(STORE_FILE);
                            await store.set(STORE_KEY_INITIAL_SYNC, true);
                            await store.save();
                            initialSyncCompleted = true;
                            renderUI();
                        }
                    } catch(e) {}
                }
            });
        }

        init();
    </script>
</body>
</html>
