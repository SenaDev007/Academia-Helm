definitions:
  - &default_environment
    # ====== Firebase ======
    # (google-services.json is committed in android/app/, no env needed)
    # ====== API ======
    API_BASE_URL: https://api.academiahelm.com/api
workflows:
  android-apk-and-aab:
    name: Android (APK + AAB)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      groups:
        - academia_helm
      vars:
        API_BASE_URL: *default_environment
      flutter: stable
      xcode: latest
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Flutter version
        script: flutter --version
      - name: Flutter clean
        script: |
          flutter clean
      - name: Install Flutter dependencies
        script: |
          flutter pub get
      - name: Generate Dart code (freezed, json_serializable, retrofit, riverpod)
        script: |
          dart run build_runner build --delete-conflicting-outputs
      - name: Build APK (debug)
        script: |
          flutter build apk --debug
      - name: Build AAB (release-ready, signed with debug key for now)
        script: |
          flutter build appbundle --release
    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/*.aab.sha256
    publishing:
      email:
        recipients:
          - senadev@academiahelm.com
