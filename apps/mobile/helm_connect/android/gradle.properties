# ============================================================================
# Helm Connect — Gradle properties
# ============================================================================
# ⭐ FIX V3-7: Aligned with apps/mobile-app gradle.properties pattern
# ============================================================================

# Increase memory for Gradle daemon (Flutter builds are memory-intensive)
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Use AndroidX (required for Flutter 3.13+)
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=36

# Properties required by recent Flutter versions (added to prevent Flutter
# from auto-modifying this file on every build, which caused git conflicts).
android.defaults.buildfeatures.buildconfig=true
android.nonFinalResIds=false

# Kotlin code style
kotlin.code.style=official
