# ============================================================================
# Helm Connect — Gradle properties
# ============================================================================

# Increase memory for Gradle daemon (Flutter builds are memory-intensive)
org.gradle.jvmargs=-Xmx4G -XX:+HeapDumpOnOutOfMemoryError -XX:MaxMetaspaceSize=2G

# Use AndroidX (required for Flutter 3.13+)
android.useAndroidX=true
android.enableJetifier=true

# Run Gradle in parallel (faster builds on multi-core machines)
org.gradle.parallel=true
org.gradle.caching=true

# Kotlin code style
kotlin.code.style=official
