# ============================================================================
# Helm Connect — Flutter dependencies
# ============================================================================
# ⭐ V3-8: Added missing packages (hive, pointycastle, flutter_secure_storage)
#   + upgraded flutter_webrtc to 1.x (fixes v1 embedding removal)
#   + removed record package (not used in code, causes record_linux build error)
# ============================================================================

name: helm_connect
description: "Helm Connect — Academia Helm mobile chat app (Flutter)."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # ─── Material + Cupertino icons
  cupertino_icons: ^1.0.8

  # ─── HTTP + WebSocket (chat real-time)
  http: ^1.2.0
  http_parser: ^4.0.2
  socket_io_client: ^2.0.3

  # ─── State management
  provider: ^6.1.2

  # ─── Local storage (offline-first)
  shared_preferences: ^2.3.0
  # hive: ^2.2.3               # V2: offline-first sync (not yet activated)
  # hive_flutter: ^1.1.0       # V2: Hive Flutter bindings

  # ─── Secure storage (auth token — V2)
  # flutter_secure_storage: ^9.0.0  # V2: migrate JWT from SharedPreferences

  # ─── Images + files
  image_picker: ^1.1.0
  file_picker: ^8.0.0
  cached_network_image: ^3.4.0

  # ─── Audio playback (ringtone service)
  audioplayers: ^5.2.0

  # ─── Push notifications (Firebase Cloud Messaging) ⭐ ACTIVE ───
  firebase_core: ^3.2.0
  firebase_messaging: ^15.0.3
  flutter_local_notifications: ^17.2.2

  # ─── WebRTC (audio/video calls) ⭐ V3-8: upgraded to 1.x (fixes v1 embedding)
  flutter_webrtc: ^1.0.0

  # ─── Permission handler (RECORD_AUDIO / CAMERA / POST_NOTIFICATIONS)
  permission_handler: ^11.3.1

  # ─── Crypto (E2E — V3)
  # encrypt: ^5.0.3
  # pointycastle: ^3.7.3

  # ─── Utilities
  intl: ^0.19.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  # hive_generator: ^2.0.1   # V2: Hive adapters
  # build_runner: ^2.4.7     # V2: code generation

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1677FF"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
