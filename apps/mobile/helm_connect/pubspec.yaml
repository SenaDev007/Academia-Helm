# ============================================================================
# Helm Connect — Flutter dependencies
# ============================================================================
# ⭐ V3-7: All package versions aligned with the user's Flutter version
#   to fix build failures (file_picker v1 embedding, flutter_local_notifications
#   ambiguous method, record missing implementations, etc.)
# ============================================================================

name: helm_connect
description: "Helm Connect — Academia Helm mobile chat app (Flutter)."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.13.0"

dependencies:
  flutter:
    sdk: flutter

  # ─── Material + Cupertino icons
  cupertino_icons: ^1.0.8

  # ─── HTTP + WebSocket (chat real-time)
  http: ^1.2.0
  http_parser: ^4.0.2
  socket_io_client: ^2.0.3

  # ─── State management
  provider: ^6.1.2

  # ─── Local storage (offline-first V2)
  shared_preferences: ^2.3.0

  # ─── Images + files
  image_picker: ^1.1.0
  file_picker: ^8.0.0        # ⭐ V3-7: upgraded from 6.1.1 to fix v1 embedding removal
  cached_network_image: ^3.4.0

  # ─── Audio recording (voice messages)
  record: ^5.1.0              # ⭐ V3-7: pinned to 5.1.x (6.x requires Dart 3.5+)
  audioplayers: ^5.2.0        # ⭐ V3-7: pinned to 5.2.x (6.x requires Dart 3.5+)

  # ─── Push notifications (Firebase Cloud Messaging) ⭐ ACTIVE ───
  firebase_core: ^3.2.0       # ⭐ V3-7: aligned with mobile-app
  firebase_messaging: ^15.0.3 # ⭐ V3-7: aligned with mobile-app
  flutter_local_notifications: ^17.2.2 # ⭐ V3-7: aligned with mobile-app (fixes bigLargeIcon ambiguous)

  # ─── WebRTC (audio/video calls — V3-4 P1) ⭐ ACTIVE
  flutter_webrtc: ^0.10.4
  # ─── Permission handler (RECORD_AUDIO / CAMERA / POST_NOTIFICATIONS) ⭐ ACTIVE
  permission_handler: ^11.3.1

  # ─── Utilities
  intl: ^0.19.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1677FF"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
