# ============================================================================
# Helm Connect — Flutter dependencies
# ============================================================================
# ⭐ V3-8: Added missing packages (hive, pointycastle, flutter_secure_storage)
#   + upgraded flutter_webrtc to 1.x (fixes v1 embedding removal)
#   + removed record package (not used in code, causes record_linux build error)
# ============================================================================

name: helm_connect
description: "Helm Connect — Academia Helm mobile chat app (Flutter)."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # ─── Material + Cupertino icons
  cupertino_icons: ^1.0.8

  # ─── HTTP + WebSocket (chat real-time)
  http: ^1.2.0
  http_parser: ^4.0.2
  socket_io_client: ^2.0.3

  # ─── State management
  provider: ^6.1.2

  # ─── Local storage (offline-first)
  shared_preferences: ^2.3.0
  # ⭐ V3-8: Hive for offline chat storage (used by chat_local_storage.dart + signal/)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # ⭐ V3-8: E2E encryption — DISABLED for now (pointycastle 3.x API incompatibility)
  # Will be re-enabled in V4 with proper Signal Protocol.
  # flutter_secure_storage: ^9.2.2
  # pointycastle: ^3.9.1

  # ─── Images + files
  image_picker: ^1.1.0
  file_picker: ^8.0.0
  cached_network_image: ^3.4.0

  # ─── Audio playback (ringtone service)
  audioplayers: ^5.2.0
  # ⭐ V3-11: Voice message recording (flutter_sound — well-maintained, pure Flutter)
  flutter_sound: ^9.16.0
  # ⭐ V3-11: Path provider for storing recorded audio files
  path_provider: ^2.1.3
  # ⭐ V3-11: Open attachments (images, audio, documents) with the system's
  #   appropriate app (gallery, music player, PDF viewer, etc.)
  url_launcher: ^6.3.0
  # ⭐ V3-11: open_filex — better than url_launcher for opening local files
  #   on Android 11+ (handles content:// URIs and ACTION_VIEW intents)
  open_filex: ^4.5.0

  # ─── Push notifications (Firebase Cloud Messaging) ⭐ ACTIVE ───
  firebase_core: ^3.2.0
  firebase_messaging: ^15.0.3
  flutter_local_notifications: ^17.2.2

  # ─── WebRTC (audio/video calls) ⭐ V3-8: upgraded to 1.x (fixes v1 embedding)
  flutter_webrtc: ^1.0.0

  # ─── Permission handler (RECORD_AUDIO / CAMERA / POST_NOTIFICATIONS)
  permission_handler: ^11.3.1

  # ─── Utilities
  intl: ^0.19.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  # ⭐ V3-8: Hive code generator (for type adapters if needed later)
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter_launcher_icons:
  android: true
  ios: true
  # ⭐ V3-11: Use the actual Helm Connect logo (not the generic messaging icon)
  image_path: "assets/icons/helm_connect.png"
  min_sdk_android: 21
  # ⭐ V3-11: Royal Blue (#0A2A5E) background — Helm Connect palette
  adaptive_icon_background: "#0A2A5E"
  adaptive_icon_foreground: "assets/icons/helm_connect.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    # ⭐ V6 — Sonnerie d'appel SORTANT identique à Yeshua Connect (web) :
    #   le même fichier ringback.wav (copie octet-octet).
    - assets/sounds/
