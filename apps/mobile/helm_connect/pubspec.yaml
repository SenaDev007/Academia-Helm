# ============================================================================
# Helm Connect — Flutter dependencies
# ============================================================================
# ⭐ Note sur Firebase :
#   Les packages Firebase (firebase_core, firebase_messaging) nécessitent
#   google-services.json (Android) et GoogleService-Info.plist (iOS) pour
#   compiler. Ils sont commentés ici pour que le projet build out-of-the-box.
#   Pour activer les push notifications en V2 :
#     1. Créer un projet Firebase : https://console.firebase.google.com
#     2. Ajouter une app Android (package: com.academiahelm.helmconnect)
#     3. Télécharger google-services.json dans android/app/
#     4. Décommenter les 3 lignes firebase_* ci-dessous
#     5. Décommenter la dépendance classpath dans android/build.gradle
#     6. Décommenter le bloc <service> dans AndroidManifest.xml
# ============================================================================

name: helm_connect
description: "Helm Connect — Academia Helm mobile chat app (Flutter)."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.13.0"

dependencies:
  flutter:
    sdk: flutter

  # ─── Material + Cupertino icons
  cupertino_icons: ^1.0.6

  # ─── HTTP + WebSocket (chat real-time)
  http: ^1.1.0
  socket_io_client: ^2.0.3

  # ─── State management
  provider: ^6.1.1

  # ─── Local storage (offline-first V2)
  shared_preferences: ^2.2.2
  # hive: ^2.2.3               # V2: offline-first sync
  # hive_flutter: ^1.1.0       # V2: Hive Flutter bindings

  # ─── Secure storage (auth token — V2)
  # flutter_secure_storage: ^9.0.0  # V2: migrate JWT from SharedPreferences

  # ─── Images + files
  image_picker: ^1.0.4        # photos + vidéos
  file_picker: ^6.1.1        # documents
  cached_network_image: ^3.3.0  # cache images

  # ─── Audio recording (voice messages)
  record: ^5.0.4              # messages vocaux
  audioplayers: ^5.2.0        # lecture audio

  # ─── Push notifications (Firebase Cloud Messaging) ⭐ ACTIVE ───
  # google-services.json is in android/app/ — registered in Firebase project academia-helm-35536
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.9
  flutter_local_notifications: ^16.0.0

  # ─── Crypto (E2E — V3)
  # encrypt: ^5.0.3
  # pointycastle: ^3.7.3

  # ─── Utilities
  intl: ^0.18.1
  uuid: ^4.2.0
  # flutter_svg: ^2.0.9       # V2: SVG icons
  # google_fonts: ^6.1.4     # V2: web fonts (Inter, etc.)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  # hive_generator: ^2.0.1   # V2: Hive adapters
  # build_runner: ^2.4.7     # V2: code generation

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1677FF"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    # Add app-specific assets here:
    # - assets/images/
    # - assets/fonts/
