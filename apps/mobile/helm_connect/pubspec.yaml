name: helm_connect
description: Helm Connect — Academia Helm mobile chat app (Flutter)
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.13.0"

dependencies:
  flutter:
    sdk: flutter

  # ─── Material + Cupertino
  cupertino_icons: ^1.0.6

  # ─── HTTP + WebSocket (chat real-time)
  http: ^1.1.0
  socket_io_client: ^2.0.3

  # ─── State management
  provider: ^6.1.1

  # ─── Local storage (offline-first)
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # ─── Secure storage (auth token)
  flutter_secure_storage: ^9.0.0

  # ─── Images + files
  image_picker: ^1.0.4
  file_picker: ^6.1.1
  cached_network_image: ^3.3.0

  # ─── Audio recording (voice messages)
  record: ^5.0.4
  audioplayers: ^5.2.0

  # ─── Push notifications (Firebase Cloud Messaging)
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.9
  flutter_local_notifications: ^16.0.0

  # ─── Crypto (E2E V2)
  encrypt: ^5.0.3
  pointycastle: ^3.7.3

  # ─── Utilities
  intl: ^0.18.1
  uuid: ^4.2.0
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
