name: academia_helm_mobile
description: Academia Helm — Application mobile de gestion scolaire
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── UI ──
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0

  # ── State Management ──
  flutter_riverpod: ^2.4.9

  # ── Navigation ──
  go_router: ^13.0.0

  # ── Network ──
  dio: ^5.4.0
  connectivity_plus: ^5.0.2

  # ── Storage ──
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # ── Auth ──
  # (custom JWT — pas de dépendance Firebase)

  # ── Utils ──
  intl: ^0.18.1
  uuid: ^4.2.0
  logger: ^2.0.2
  url_launcher: ^6.2.2

  # ── Push Notifications ──
  flutter_local_notifications: ^16.3.0
  firebase_messaging: ^14.7.9
  firebase_core: ^2.24.2

  # ── PDF Viewer (bulletins, reçus) ──
  syncfusion_flutter_pdfviewer: ^24.2.3

  # ── Charts (dashboard) ──
  fl_chart: ^0.66.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  json_serializable: ^6.2.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
