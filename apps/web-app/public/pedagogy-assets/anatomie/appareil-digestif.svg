<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 340" width="460" height="340">
<rect width="460" height="340" fill="#ffffff"/>
<text x="230" y="24" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">L'appareil digestif</text>

  <!-- silhouette -->
  <path d="M175 60 q55 -35 110 0 q18 60 12 120 q-4 60 -14 95 q-6 20 -18 20 q-12 0 -18 -20 q-10 -35 -14 -95 q-6 -60 12 -120 z" fill="#fecdd3" stroke="#475569" stroke-width="1.5"/>
