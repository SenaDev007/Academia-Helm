  <path d="M262 128 q30 -4 34 14 q-20 14 -40 8 z" fill="#a78bfa" stroke="#7c3aed" stroke-width="1.5"/>
  <line x1="230" y1="100" x2="300" y2="96" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>
