<text x="300" y="96" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#334155" text-anchor="start">Œsophage</text>
  <line x1="200" y1="150" x2="120" y2="156" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>
<circle cx="200" cy="150" r="2.5" fill="#64748b"/>
<text x="120" y="156" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#334155" text-anchor="start">Estomac</text>
  <line x1="285" y1="132" x2="330" y2="128" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>
<circle cx="285" cy="132" r="2.5" fill="#64748b"/>
<text x="330" y="128" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#334155" text-anchor="start">Foie</text>
  <line x1="238" y1="230" x2="330" y2="236" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>
<circle cx="238" cy="230" r="2.5" fill="#64748b"/>
<text x="330" y="236" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#334155" text-anchor="start">Intestin grêle</text>
  <line x1="160" y1="200" x2="96" y2="210" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>
<circle cx="160" cy="200" r="2.5" fill="#64748b"/>
<text x="96" y="210" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#334155" text-anchor="start">Gros intestin</text>
  <line x1="232" y1="78" x2="300" y2="64" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>
<circle cx="232" cy="78" r="2.5" fill="#64748b"/>
<text x="300" y="64" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#334155" text-anchor="start">Bouche</text>
  <line x1="272" y1="292" x2="330" y2="296" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>
<circle cx="272" cy="292" r="2.5" fill="#64748b"/>
<text x="330" y="296" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#334155" text-anchor="start">Anus</text>
  <path d="M272 292 l-6 -10" stroke="#94a3b8" stroke-width="1"/>
  <text x="230" y="330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#64748b">Le trajet des aliments : bouche → œsophage → estomac → intestins → anus</text>

</svg>
