  <!-- bouche -->
  <path d="M226 74 q6 6 12 0" fill="none" stroke="#475569" stroke-width="2"/>
  <!-- œsophage -->
  <path d="M230 84 L230 120" stroke="#fca5a5" stroke-width="9" fill="none" stroke-linecap="round"/>
