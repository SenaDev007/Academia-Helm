<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" width="420" height="320">
<rect width="420" height="320" fill="#ffffff"/>
<text x="210" y="24" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Anatomie d'une dent</text>

  <!-- gencive -->
  <path d="M60 170 q80 -22 160 0 q80 22 140 0 l0 24 l-300 0 z" fill="#fecdd3" stroke="#e11d48" stroke-width="1.5"/>
  <!-- dent -->
  <path d="M140 60 q-30 30 -22 66 q6 28 32 30 l0 -96 z" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <path d="M280 60 q30 30 22 66 q-6 28 -32 30 l0 -96 z" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <path d="M140 60 q70 -34 140 0 l0 96 q-70 20 -140 0 z" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <!-- racines -->
  <path d="M140 156 q-10 50 -4 86 q4 18 12 8 q6 -10 4 -40 l-4 -54 z" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <path d="M280 156 q10 50 4 86 q-4 18 -12 8 q-6 -10 -4 -40 l4 -54 z" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <!-- pulpe -->
  <path d="M196 70 q24 -8 48 0 l0 70 q-24 14 -48 0 z" fill="#fca5a5" stroke="#b91c1c" stroke-width="1.2"/>
  <path d="M196 140 q24 10 48 0 l-6 60 q-18 10 -36 0 z" fill="#fca5a5" stroke="#b91c1c" stroke-width="1.2"/>
  <!-- nerf -->
  <path d="M220 200 q0 20 -4 44" stroke="#e11d48" stroke-width="3" fill="none"/>
  <line x1="180" y1="68" x2="96" y2="56" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>
<circle cx="180" cy="68" r="2.5" fill="#64748b"/>
<text x="96" y="56" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#334155" text-anchor="start">Émail</text>
  <line x1="210" y1="100" x2="320" y2="100" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>
<circle cx="210" cy="100" r="2.5" fill="#64748b"/>
<text x="320" y="100" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#334155" text-anchor="start">Dentine</text>
  <line x1="222" y1="120" x2="318" y2="128" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>
<circle cx="222" cy="120" r="2.5" fill="#64748b"/>
<text x="318" y="128" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#334155" text-anchor="start">Pulpe (nerf, vaisseaux)</text>
  <line x1="150" y1="130" x2="86" y2="130" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>
<circle cx="150" cy="130" r="2.5" fill="#64748b"/>
<text x="86" y="130" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#334155" text-anchor="start">Gencive</text>
  <line x1="136" y1="210" x2="82" y2="214" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>
<circle cx="136" cy="210" r="2.5" fill="#64748b"/>
<text x="82" y="214" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#334155" text-anchor="start">Racine</text>
  <line x1="216" y1="236" x2="260" y2="252" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>
<circle cx="216" cy="236" r="2.5" fill="#64748b"/>
<text x="260" y="252" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#334155" text-anchor="start">Nerf</text>
  <text x="210" y="306" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#64748b">La carie attaque d'abord l'émail, puis la dentine et enfin la pulpe</text>

</svg>
