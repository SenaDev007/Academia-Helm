<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 330" width="460" height="330">
<rect width="460" height="330" fill="#ffffff"/>
<text x="230" y="24" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">La cellule végétale</text>

  <rect x="70" y="60" width="320" height="220" rx="18" fill="#bbf7d0" stroke="#166534" stroke-width="3"/>
  <!-- paroi -->
  <rect x="62" y="52" width="336" height="236" rx="22" fill="none" stroke="#166534" stroke-width="2" stroke-dasharray="6 4"/>
  <!-- vacuole -->
  <ellipse cx="240" cy="180" rx="92" ry="62" fill="#a5f3fc" stroke="#0891b2" stroke-width="2"/>
  <!-- noyau -->
  <circle cx="150" cy="120" r="30" fill="#c084fc" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="150" cy="120" r="8" fill="#7c3aed"/>
  <!-- chloroplastes -->
  <ellipse cx="330" cy="110" rx="18" ry="11" fill="#22c55e" stroke="#15803d" stroke-width="1.5" transform="rotate(-20 330 110)"/>
  <ellipse cx="350" cy="150" rx="18" ry="11" fill="#22c55e" stroke="#15803d" stroke-width="1.5" transform="rotate(30 350 150)"/>
  <ellipse cx="110" cy="220" rx="18" ry="11" fill="#22c55e" stroke="#15803d" stroke-width="1.5" transform="rotate(15 110 220)"/>
  <ellipse cx="330" cy="240" rx="18" ry="11" fill="#22c55e" stroke="#15803d" stroke-width="1.5" transform="rotate(-30 330 240)"/>
  <!-- mitochondries -->
  <ellipse cx="300" cy="200" rx="16" ry="9" fill="#fca5a5" stroke="#b91c1c" stroke-width="1.5"/>
  <line x1="64" y1="54" x2="20" y2="36" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>
<circle cx="64" cy="54" r="2.5" fill="#64748b"/>
<text x="20" y="36" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#334155" text-anchor="start">Paroi cellulaire</text>
  <line x1="150" y1="120" x2="84" y2="96" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>
<circle cx="150" cy="120" r="2.5" fill="#64748b"/>
<text x="84" y="96" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#334155" text-anchor="start">Noyau</text>
  <line x1="240" y1="180" x2="230" y2="272" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>
<circle cx="240" cy="180" r="2.5" fill="#64748b"/>
<text x="230" y="272" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#334155" text-anchor="start">Vacuole</text>
  <line x1="330" y1="110" x2="366" y2="88" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>
<circle cx="330" cy="110" r="2.5" fill="#64748b"/>
<text x="366" y="88" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#334155" text-anchor="start">Chloroplastes</text>
  <line x1="240" y1="100" x2="288" y2="62" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>
<circle cx="240" cy="100" r="2.5" fill="#64748b"/>
<text x="288" y="62" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#334155" text-anchor="start">Membrane + cytoplasme</text>
  <line x1="300" y1="200" x2="372" y2="214" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>
<circle cx="300" cy="200" r="2.5" fill="#64748b"/>
<text x="372" y="214" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#334155" text-anchor="start">Mitochondrie</text>
  <text x="230" y="316" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#64748b">La cellule est l'unité de base des êtres vivants</text>

</svg>
