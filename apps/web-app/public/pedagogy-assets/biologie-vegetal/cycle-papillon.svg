<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" width="460" height="300">
<rect width="460" height="300" fill="#ffffff"/>
<text x="230" y="24" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Le cycle du papillon (métamorphose)</text>

  <!-- œuf -->
  <ellipse cx="80" cy="230" rx="12" ry="16" fill="#fde68a" stroke="#a16207" stroke-width="1.5"/>
  <!-- chenille -->
  <path d="M60 120 q14 -14 30 0 q14 12 28 0 q14 -12 28 0 q14 12 24 0" fill="none" stroke="#84cc16" stroke-width="13" stroke-linecap="round"/>
  <circle cx="176" cy="108" r="11" fill="#a3e635" stroke="#4d7c0f" stroke-width="1.5"/>
  <circle cx="172" cy="106" r="2" fill="#1c1917"/><circle cx="180" cy="106" r="2" fill="#1c1917"/>
  <path d="M170 98 q-2 -8 2 -12 M180 98 q4 -8 8 -10" stroke="#4d7c0f" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- chrysalide -->
  <path d="M330 200 q-12 10 -8 34 q4 18 16 14 q10 -4 6 -24 q-2 -16 -14 -24 z" fill="#d8b4fe" stroke="#7c3aed" stroke-width="1.5"/>
  <path d="M322 214 h18 M322 226 h18" stroke="#7c3aed" stroke-width="1"/>
  <!-- papillon -->
  <ellipse cx="360" cy="90" rx="9" ry="26" fill="#7c3aed"/>
  <path d="M356 70 q-40 -34 -58 4 q-10 28 34 30 z" fill="#c4b5fd" stroke="#7c3aed" stroke-width="1.5"/>
  <path d="M364 70 q40 -34 58 4 q10 28 -34 30 z" fill="#c4b5fd" stroke="#7c3aed" stroke-width="1.5"/>
  <path d="M358 106 q-30 30 2 34 q22 2 12 -30 z" fill="#a78bfa" stroke="#7c3aed" stroke-width="1.5"/>
  <path d="M362 106 q30 30 -2 34 q-22 2 -12 -30 z" fill="#a78bfa" stroke="#7c3aed" stroke-width="1.5"/>
  <path d="M356 48 q-6 -14 -2 -20 M364 48 q6 -14 2 -20" stroke="#7c3aed" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- flèches cycle -->
  <path d="M84 208 q40 -60 66 -80" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#cb)"/>
  <path d="M212 106 q60 8 86 66" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#cb)"/>
  <path d="M316 208 q-120 40 -212 8" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#cb)"/>
  <defs><marker id="cb" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0 0 L8 3.5 L0 7 z" fill="#475569"/></marker></defs>
  <text x="80" y="270" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#a16207" font-weight="bold">1. Œuf</text>
  <text x="140" y="76" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#4d7c0f" font-weight="bold">2. Chenille</text>
  <text x="330" y="270" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#7c3aed" font-weight="bold">3. Chrysalide</text>
  <text x="366" y="160" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#7c3aed" font-weight="bold">4. Papillon</text>
  <text x="230" y="292" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#64748b">La femelle pond des œufs → le cycle recommence</text>

</svg>
