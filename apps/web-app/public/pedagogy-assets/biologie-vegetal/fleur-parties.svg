<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 330" width="420" height="330">
<rect width="420" height="330" fill="#ffffff"/>
<text x="210" y="24" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">La fleur et ses parties</text>

  <!-- tige -->
  <path d="M210 180 L210 300" stroke="#22c55e" stroke-width="6" stroke-linecap="round"/>
  <!-- feuilles -->
