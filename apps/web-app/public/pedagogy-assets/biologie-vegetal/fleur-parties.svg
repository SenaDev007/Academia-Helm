  <path d="M210 226 q34 -6 44 -30 q-30 -6 -44 18 z" fill="#86efac" stroke="#16a34a" stroke-width="1.5"/>
  <!-- pétales -->
  <circle cx="210" cy="120" r="34" fill="#fda4af" stroke="#e11d48" stroke-width="1.5"/>
  <ellipse cx="210" cy="66" rx="26" ry="34" fill="#fda4af" stroke="#e11d48" stroke-width="1.5"/>
  <ellipse cx="210" cy="174" rx="26" ry="34" fill="#fda4af" stroke="#e11d48" stroke-width="1.5"/>
  <ellipse cx="156" cy="120" rx="34" ry="26" fill="#fda4af" stroke="#e11d48" stroke-width="1.5"/>
  <ellipse cx="264" cy="120" rx="34" ry="26" fill="#fda4af" stroke="#e11d48" stroke-width="1.5"/>
  <!-- pistil -->
  <circle cx="210" cy="120" r="14" fill="#fcd34d" stroke="#b45309" stroke-width="2"/>
  <!-- étamines -->
  <circle cx="196" cy="106" r="4" fill="#f59e0b"/><circle cx="224" cy="106" r="4" fill="#f59e0b"/>
  <circle cx="196" cy="134" r="4" fill="#f59e0b"/><circle cx="224" cy="134" r="4" fill="#f59e0b"/>
  <line x1="210" y1="60" x2="300" y2="52" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>
<circle cx="210" cy="60" r="2.5" fill="#64748b"/>
<text x="300" y="52" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#334155" text-anchor="start">Pétales</text>
  <line x1="214" y1="118" x2="300" y2="116" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>
<circle cx="214" cy="118" r="2.5" fill="#64748b"/>
<text x="300" y="116" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#334155" text-anchor="start">Pistil</text>
  <line x1="226" y1="106" x2="306" y2="90" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>
<circle cx="226" cy="106" r="2.5" fill="#64748b"/>
<text x="306" y="90" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#334155" text-anchor="start">Étamines</text>
  <line x1="212" y1="290" x2="276" y2="292" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>
<circle cx="212" cy="290" r="2.5" fill="#64748b"/>
<text x="276" y="292" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#334155" text-anchor="start">Tige</text>
  <line x1="176" y1="244" x2="108" y2="250" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>
<circle cx="176" cy="244" r="2.5" fill="#64748b"/>
<text x="108" y="250" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#334155" text-anchor="start">Feuille</text>
  <text x="210" y="322" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#64748b">La fleur est l'organe de la reproduction : étamines (pollen) + pistil → fruit et graines</text>

