<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 320" width="440" height="320">
<rect width="440" height="320" fill="#ffffff"/>
<text x="220" y="24" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">La photosynthèse</text>

  <!-- soleil -->
  <circle cx="70" cy="60" r="26" fill="#fcd34d" stroke="#b45309" stroke-width="2"/>
  <path d="M70 20 v-10 M70 100 v10 M30 60 h-10 M110 60 h10 M42 32 l-8 -8 M98 88 l8 8 M98 32 l8 -8 M42 88 l-8 8" stroke="#b45309" stroke-width="2.5" stroke-linecap="round"/>
  <!-- feuille -->
  <path d="M210 190 q-70 -90 -120 -70 q-10 70 66 96 q34 12 54 -26 z" fill="#86efac" stroke="#16a34a" stroke-width="2"/>
  <path d="M96 124 q54 18 106 62" stroke="#15803d" stroke-width="2" fill="none"/>
  <path d="M130 138 l8 16 M158 156 l10 16 M186 174 l8 14" stroke="#15803d" stroke-width="1.5" fill="none"/>
  <!-- flèches -->
  <path d="M104 88 q40 10 60 40" stroke="#b45309" stroke-width="3" fill="none" marker-end="url(#arrO)"/>
  <path d="M330 120 q-60 10 -84 48" stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arrG)"/>
  <path d="M262 250 q40 -6 66 -34" stroke="#22c55e" stroke-width="3" fill="none" marker-end="url(#arrV)"/>
  <path d="M196 262 q-40 6 -66 34" stroke="#7dd3fc" stroke-width="3" fill="none" marker-end="url(#arrB)"/>
  <defs>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 z" fill="#b45309"/></marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 z" fill="#94a3b8"/></marker>
    <marker id="arrV" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 z" fill="#22c55e"/></marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 z" fill="#0ea5e9"/></marker>
  </defs>
  <text x="66" y="120" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#b45309" font-weight="bold">Lumière du soleil</text>
  <text x="330" y="104" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#64748b" font-weight="bold">CO₂ (gaz carbonique)</text>
  <text x="296" y="252" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#16a34a" font-weight="bold">O₂ (oxygène)</text>
  <text x="96" y="292" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#0284c7" font-weight="bold">Eau</text>
  <text x="220" y="306" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#64748b">Les feuilles fabriquent la sève et libèrent de l'oxygène grâce à la lumière</text>

</svg>
