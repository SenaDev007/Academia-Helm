<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 330" width="430" height="330">
<rect width="430" height="330" fill="#ffffff"/>
<text x="215" y="24" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Les couches internes de la Terre</text>

  <!-- coupe quart -->
  <path d="M215 70 a120 120 0 0 1 0 240 a120 120 0 0 1 0 -240 z" fill="#b45309" stroke="#78350f" stroke-width="2"/>
  <path d="M215 110 a80 80 0 0 1 0 160 a80 80 0 0 1 0 -160 z" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
  <path d="M215 140 a50 50 0 0 1 0 100 a50 50 0 0 1 0 -100 z" fill="#fbbf24" stroke="#b45309" stroke-width="2"/>
  <circle cx="215" cy="190" r="20" fill="#fca5a5" stroke="#b91c1c" stroke-width="2"/>
  <!-- croûte -->
  <path d="M215 70 a120 120 0 0 1 40 7 l-8 18 a100 100 0 0 0 -32 -6 z" fill="#a8a29e"/>
  <line x1="268" y1="92" x2="330" y2="66" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>
<circle cx="268" cy="92" r="2.5" fill="#64748b"/>
<text x="330" y="66" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#334155" text-anchor="start">Croûte terrestre (fine)</text>
  <line x1="296" y1="132" x2="356" y2="132" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>
<circle cx="296" cy="132" r="2.5" fill="#64748b"/>
<text x="356" y="132" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#334155" text-anchor="start">Manteau</text>
  <line x1="262" y1="168" x2="330" y2="172" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>
<circle cx="262" cy="168" r="2.5" fill="#64748b"/>
<text x="330" y="172" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#334155" text-anchor="start">Noyau externe</text>
  <line x1="236" y1="190" x2="300" y2="208" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>
<circle cx="236" cy="190" r="2.5" fill="#64748b"/>
<text x="300" y="208" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#334155" text-anchor="start">Noyau interne</text>
  <text x="215" y="306" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#64748b">La Terre est formée de couches : la croûte, le manteau et le noyau</text>

</svg>
