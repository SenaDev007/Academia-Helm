<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 330" width="460" height="330">
<rect width="460" height="330" fill="#ffffff"/>
<text x="230" y="24" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Le cycle des roches</text>

  <!-- roches ignées -->
  <path d="M90 90 q30 -20 60 0 q14 12 0 26 q-30 20 -60 0 q-14 -14 0 -26 z" fill="#a8a29e" stroke="#57534e" stroke-width="2"/>
  <path d="M104 96 l10 16 M124 92 l12 18 M142 98 l8 12" stroke="#78716c" stroke-width="2"/>
  <!-- sédimentaire -->
  <path d="M320 84 q34 -14 64 0 q12 10 0 22 q-34 16 -64 0 q-12 -12 0 -22 z" fill="#d6d3d1" stroke="#57534e" stroke-width="2"/>
  <path d="M330 92 h44 M330 100 h44" stroke="#a8a29e" stroke-width="2"/>
  <!-- métamorphique -->
  <path d="M210 244 q32 -16 62 0 q12 12 0 24 q-32 16 -62 0 q-12 -12 0 -24 z" fill="#b45309" stroke="#78350f" stroke-width="2"/>
  <path d="M218 250 q20 -8 44 0 M222 260 q16 -6 36 0" stroke="#78350f" stroke-width="2" fill="none"/>
  <!-- flèches -->
  <path d="M160 96 q70 -14 150 4" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#rk)"/>
  <path d="M352 116 q-20 60 -80 100" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#rk)"/>
  <path d="M240 244 q-6 -70 -60 -110" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#rk)"/>
  <path d="M118 122 q10 70 60 106" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#rk)" stroke-dasharray="6 4"/>
  <defs><marker id="rk" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0 0 L8 3.5 L0 7 z" fill="#475569"/></marker></defs>
  <text x="120" y="126" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#166534" font-weight="bold">Roches ignées</text>
  <text x="120" y="140" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#64748b">(refroidissement du magma)</text>
  <text x="352" y="76" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#57534e" font-weight="bold">Roches sédimentaires</text>
  <text x="352" y="62" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#64748b">(dépôt de sédiments)</text>
  <text x="240" y="232" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#92400e" font-weight="bold">Roches métamorphiques</text>
  <text x="240" y="286" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#64748b">(chaleur + pression)</text>
  <text x="238" y="60" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#64748b">érosion → sédimentation</text>
  <text x="368" y="182" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#64748b">compression, cimentation</text>
  <text x="106" y="188" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#64748b">fusion (magma)</text>

</svg>
