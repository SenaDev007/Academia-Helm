  <ellipse cx="196" cy="270" rx="52" ry="26" fill="#ef4444" stroke="#991b1b" stroke-width="2"/>
  <!-- cheminée -->
  <path d="M186 250 l4 -84 q10 -8 20 0 l-4 84 z" fill="#ef4444" stroke="#991b1b" stroke-width="1.5"/>
