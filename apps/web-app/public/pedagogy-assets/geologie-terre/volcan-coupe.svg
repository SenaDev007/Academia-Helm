  <!-- coulée -->
  <path d="M214 166 q28 20 40 60 q8 26 -6 40" stroke="#ef4444" stroke-width="10" fill="none" stroke-linecap="round"/>
  <line x1="196" y1="270" x2="268" y2="282" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>
<circle cx="196" cy="270" r="2.5" fill="#64748b"/>
<text x="268" y="282" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#334155" text-anchor="start">Chambre magmatique</text>
  <line x1="196" y1="210" x2="258" y2="210" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>
<circle cx="196" cy="210" r="2.5" fill="#64748b"/>
<text x="258" y="210" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#334155" text-anchor="start">Cheminée</text>
  <line x1="178" y1="166" x2="116" y2="148" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>
<circle cx="178" cy="166" r="2.5" fill="#64748b"/>
<text x="116" y="148" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#334155" text-anchor="start">Cratère</text>
  <line x1="252" y1="240" x2="320" y2="244" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>
<circle cx="252" cy="240" r="2.5" fill="#64748b"/>
<text x="320" y="244" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#334155" text-anchor="start">Coulée de lave</text>
  <line x1="214" y1="96" x2="276" y2="76" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>
<circle cx="214" cy="96" r="2.5" fill="#64748b"/>
<text x="276" y="76" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#334155" text-anchor="start">Projections (cendres, bombes)</text>
  <text x="215" y="318" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#64748b">Le magma remonte par la cheminée et sort par le cratère : c'est l'éruption</text>

</svg>
