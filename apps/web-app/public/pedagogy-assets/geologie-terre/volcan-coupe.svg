  <path d="M170 164 q26 -10 52 0" fill="none" stroke="#57534e" stroke-width="3"/>
  <path d="M196 160 q-6 -46 -30 -66 M196 160 q0 -52 6 -72 M196 160 q10 -44 34 -58" stroke="#f97316" stroke-width="7" fill="none" stroke-linecap="round"/>
