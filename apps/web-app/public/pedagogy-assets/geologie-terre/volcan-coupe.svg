<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 330" width="430" height="330">
<rect width="430" height="330" fill="#ffffff"/>
<text x="215" y="24" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Le volcan en coupe</text>

  <!-- montagne -->
