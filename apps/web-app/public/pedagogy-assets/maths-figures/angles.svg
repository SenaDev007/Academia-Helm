<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 280" width="460" height="280">
<rect width="460" height="280" fill="#ffffff"/>
<text x="230" y="24" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Les types d'angles</text>

  <!-- aigu -->
  <path d="M60 200 L180 200" stroke="#1d4ed8" stroke-width="2.5"/>
  <path d="M60 200 L140 130" stroke="#1d4ed8" stroke-width="2.5"/>
  <path d="M92 200 A32 32 0 0 0 82 176" fill="none" stroke="#dc2626" stroke-width="2"/>
  <circle cx="60" cy="200" r="3" fill="#1d4ed8"/>
  <text x="60" y="222" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#334155" font-weight="bold">Aigu</text>
  <text x="60" y="238" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#64748b">moins de 90°</text>
  <!-- droit -->
  <path d="M200 200 L320 200" stroke="#1d4ed8" stroke-width="2.5"/>
  <path d="M200 200 L200 116" stroke="#1d4ed8" stroke-width="2.5"/>
  <path d="M200 190 h10 v10" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <circle cx="200" cy="200" r="3" fill="#1d4ed8"/>
  <text x="232" y="222" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#334155" font-weight="bold">Droit</text>
  <text x="232" y="238" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#64748b">exactement 90°</text>
  <!-- obtus -->
  <path d="M340 200 L440 200" stroke="#1d4ed8" stroke-width="2.5"/>
  <path d="M340 200 L392 118" stroke="#1d4ed8" stroke-width="2.5"/>
  <path d="M372 200 A32 32 0 0 0 352 168" fill="none" stroke="#dc2626" stroke-width="2"/>
  <circle cx="340" cy="200" r="3" fill="#1d4ed8"/>
  <text x="368" y="222" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#334155" font-weight="bold">Obtus</text>
  <text x="368" y="238" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#64748b">entre 90° et 180°</text>
  <!-- plat -->
  <path d="M60 60 L250 60" stroke="#1d4ed8" stroke-width="2.5"/>
  <circle cx="155" cy="60" r="3" fill="#1d4ed8"/>
  <path d="M187 60 A32 32 0 0 0 123 60" fill="none" stroke="#dc2626" stroke-width="2"/>
  <text x="155" y="40" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#334155" font-weight="bold">Angle plat = 180°</text>
  <text x="155" y="102" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#64748b">Un tour complet = 360°</text>
  <text x="230" y="266" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#64748b">On mesure les angles avec le rapporteur</text>

</svg>
