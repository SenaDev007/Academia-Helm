<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 320" width="430" height="320">
<rect width="430" height="320" fill="#ffffff"/>
<text x="215" y="24" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Le cercle</text>

  <circle cx="200" cy="170" r="110" fill="none" stroke="#1d4ed8" stroke-width="2.5"/>
  <circle cx="200" cy="170" r="3.5" fill="#1d4ed8"/>
  <!-- rayon -->
  <line x1="200" y1="170" x2="282" y2="112" stroke="#dc2626" stroke-width="2.5"/>
  <!-- diamètre -->
  <line x1="92" y1="228" x2="308" y2="112" stroke="#16a34a" stroke-width="2.5"/>
  <!-- corde -->
  <line x1="118" y1="120" x2="270" y2="106" stroke="#9333ea" stroke-width="2.5"/>
  <!-- arc -->
  <path d="M240 68 q-30 -12 -60 6" fill="none" stroke="#ea580c" stroke-width="2.5"/>
  <line x1="200" y1="170" x2="158" y2="196" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>
<circle cx="200" cy="170" r="2.5" fill="#64748b"/>
<text x="158" y="196" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#334155" text-anchor="start">Centre O</text>
  <line x1="248" y1="138" x2="296" y2="130" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>
<circle cx="248" cy="138" r="2.5" fill="#64748b"/>
<text x="296" y="130" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#dc2626" text-anchor="start">Rayon r</text>
  <line x1="200" y1="170" x2="0" y2="0" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>
<circle cx="200" cy="170" r="2.5" fill="#64748b"/>
<text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#334155" text-anchor="start"></text>
  <text x="196" y="180" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1d4ed8" font-weight="bold">O</text>
  <text x="288" y="108" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1d4ed8">A</text>
  <text x="86" y="238" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1d4ed8">B</text>
  <text x="312" y="108" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1d4ed8">C</text>
  <text x="112" y="116" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1d4ed8">D</text>
  <text x="272" y="100" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1d4ed8">E</text>
  <line x1="128" y1="228" x2="60" y2="262" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>
<circle cx="128" cy="228" r="2.5" fill="#64748b"/>
<text x="60" y="262" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#15803d" text-anchor="start">Diamètre = 2 × r (segment [BC])</text>
  <line x1="190" y1="116" x2="84" y2="84" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>
<circle cx="190" cy="116" r="2.5" fill="#64748b"/>
<text x="84" y="84" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#7c3aed" text-anchor="start">Corde [DE]</text>
  <line x1="222" y1="70" x2="258" y2="48" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>
<circle cx="222" cy="70" r="2.5" fill="#64748b"/>
<text x="258" y="48" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#c2410c" text-anchor="start">Arc</text>
  <text x="215" y="304" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#64748b">Tous les points du cercle sont à la même distance r du centre O</text>

</svg>
