<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 200" width="470" height="200">
<rect width="470" height="200" fill="#ffffff"/>
<text x="235" y="24" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">La droite graduée</text>

  <line x1="30" y1="110" x2="440" y2="110" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#dr)"/>
  <defs><marker id="dr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8 z" fill="#1d4ed8"/></marker></defs>
  <!-- graduations -->
  
    <line x1="40" y1="100" x2="40" y2="120" stroke="#1d4ed8" stroke-width="2"/>
    <text x="40" y="142" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#334155">0</text>
  
    <line x1="78" y1="100" x2="78" y2="120" stroke="#1d4ed8" stroke-width="2"/>
    <text x="78" y="142" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#334155">1</text>
  
    <line x1="116" y1="100" x2="116" y2="120" stroke="#1d4ed8" stroke-width="2"/>
    <text x="116" y="142" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#334155">2</text>
  
    <line x1="154" y1="100" x2="154" y2="120" stroke="#1d4ed8" stroke-width="2"/>
    <text x="154" y="142" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#334155">3</text>
  
    <line x1="192" y1="100" x2="192" y2="120" stroke="#1d4ed8" stroke-width="2"/>
