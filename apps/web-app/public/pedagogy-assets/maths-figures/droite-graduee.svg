    <line x1="230" y1="100" x2="230" y2="120" stroke="#1d4ed8" stroke-width="2"/>
    <text x="230" y="142" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#334155">5</text>
  
    <line x1="268" y1="100" x2="268" y2="120" stroke="#1d4ed8" stroke-width="2"/>
    <text x="268" y="142" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#334155">6</text>
  
    <line x1="306" y1="100" x2="306" y2="120" stroke="#1d4ed8" stroke-width="2"/>
    <text x="306" y="142" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#334155">7</text>
  
    <line x1="344" y1="100" x2="344" y2="120" stroke="#1d4ed8" stroke-width="2"/>
    <text x="344" y="142" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#334155">8</text>
  
    <line x1="382" y1="100" x2="382" y2="120" stroke="#1d4ed8" stroke-width="2"/>
    <text x="382" y="142" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#334155">9</text>
  
    <line x1="420" y1="100" x2="420" y2="120" stroke="#1d4ed8" stroke-width="2"/>
    <text x="420" y="142" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#334155">10</text>
  
  <!-- points -->
  <circle cx="78" cy="110" r="5" fill="#dc2626"/><text x="78" y="86" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#dc2626" font-weight="bold">A (1)</text>
  <circle cx="192" cy="110" r="5" fill="#16a34a"/><text x="192" y="86" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#16a34a" font-weight="bold">B (4)</text>
  <circle cx="325" cy="110" r="5" fill="#9333ea"/><text x="325" y="86" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#9333ea" font-weight="bold">C (7,5)</text>
  <!-- demi-droite [AB) -->
  <text x="235" y="172" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#64748b">Distance A → B = 4 − 1 = 3 unités (longueur du segment [AB])</text>

</svg>
