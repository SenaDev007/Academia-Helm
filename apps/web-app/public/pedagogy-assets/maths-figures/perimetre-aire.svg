<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" width="460" height="300">
<rect width="460" height="300" fill="#ffffff"/>
<text x="230" y="24" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Périmètre et aire</text>

  <!-- périmètre -->
  <rect x="60" y="80" width="140" height="100" fill="none" stroke="#dc2626" stroke-width="4"/>
  <text x="130" y="66" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#dc2626" font-weight="bold">Périmètre</text>
  <text x="130" y="135" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#334155">le tour de la figure</text>
  <text x="130" y="212" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#dc2626" font-weight="bold">P = 2 × (L + l)</text>
  <!-- flèches contour -->
  <path d="M60 68 q70 -12 140 0" fill="none" stroke="#dc2626" stroke-width="1.5"/>
  <!-- aire -->
  <rect x="280" y="80" width="140" height="100" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
  <!-- quadrillage -->
  <line x1="308" y1="80" x2="308" y2="180" stroke="#93c5fd" stroke-width="1"/><line x1="336" y1="80" x2="336" y2="180" stroke="#93c5fd" stroke-width="1"/><line x1="364" y1="80" x2="364" y2="180" stroke="#93c5fd" stroke-width="1"/><line x1="392" y1="80" x2="392" y2="180" stroke="#93c5fd" stroke-width="1"/>
  <line x1="280" y1="105" x2="420" y2="105" stroke="#93c5fd" stroke-width="1"/><line x1="280" y1="130" x2="420" y2="130" stroke="#93c5fd" stroke-width="1"/><line x1="280" y1="155" x2="420" y2="155" stroke="#93c5fd" stroke-width="1"/>
  <text x="350" y="66" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1d4ed8" font-weight="bold">Aire</text>
  <text x="350" y="135" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#334155">la surface colorée</text>
  <text x="350" y="212" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1d4ed8" font-weight="bold">A = L × l</text>
  <!-- unités -->
  <text x="130" y="238" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#64748b">unité : m, cm, km…</text>
  <text x="350" y="238" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#64748b">unité : m², cm²…</text>
  <text x="230" y="278" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#64748b">Exemple : L = 5 cm et l = 3 cm → P = 16 cm, A = 15 cm²</text>

</svg>
