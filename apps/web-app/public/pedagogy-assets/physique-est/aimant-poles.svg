<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 300" width="450" height="300">
<rect width="450" height="300" fill="#ffffff"/>
<text x="225" y="24" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">L'aimant et ses pôles</text>

  <!-- aimant en U -->
  <path d="M120 90 v80 a50 50 0 0 0 100 0 v-80" fill="none" stroke="#dc2626" stroke-width="26"/>
  <path d="M120 90 v80 a50 50 0 0 0 100 0 v-80" fill="none" stroke="#1d4ed8" stroke-width="26" stroke-dasharray="47 58" stroke-dashoffset="-58"/>
  <!-- pôles -->
  <rect x="107" y="64" width="26" height="26" rx="3" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <rect x="207" y="64" width="26" height="26" rx="3" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="120" y="82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#b91c1c" font-weight="bold">N</text>
  <text x="220" y="82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1e40af" font-weight="bold">S</text>
  <!-- lignes de champ -->
  <path d="M133 70 q0 -34 67 -34 q67 0 67 34" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5 4"/>
  <path d="M133 62 q0 -52 67 -52 q67 0 67 52" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5 4"/>
  <path d="M133 78 q0 -18 67 -18 q67 0 67 18" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5 4"/>
  <!-- attraction/répulsion -->
  <g transform="translate(288 180)">
    <rect x="0" y="0" width="34" height="60" rx="4" fill="#ef4444"/>
    <text x="17" y="36" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#ffffff" font-weight="bold">N</text>
    <rect x="62" y="0" width="34" height="60" rx="4" fill="#3b82f6"/>
    <text x="79" y="36" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#ffffff" font-weight="bold">S</text>
    <path d="M38 30 h8 M50 30 h8" stroke="#16a34a" stroke-width="2.5" marker-end="url(#aa)"/>
    <text x="48" y="84" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#15803d" font-weight="bold">attraction</text>
  </g>
  <g transform="translate(288 250)">
    <rect x="0" y="0" width="34" height="34" rx="4" fill="#ef4444"/>
    <text x="17" y="23" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#ffffff" font-weight="bold">N</text>
    <rect x="62" y="0" width="34" height="34" rx="4" fill="#ef4444"/>
    <text x="79" y="23" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#ffffff" font-weight="bold">N</text>
    <path d="M38 17 h6 M52 17 h6" stroke="#dc2626" stroke-width="2.5"/>
    <text x="48" y="56" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#b91c1c" font-weight="bold">répulsion</text>
  </g>
  <defs><marker id="aa" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0 0 L8 3.5 L0 7 z" fill="#16a34a"/></marker></defs>
  <text x="140" y="280" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#64748b">Les pôles contraires s'attirent, les pôles identiques se repoussent</text>

</svg>
