<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 300" width="430" height="300">
<rect width="430" height="300" fill="#ffffff"/>
<text x="215" y="24" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">La balance à plateaux</text>

  <!-- socle -->
