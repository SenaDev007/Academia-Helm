  <!-- plateaux -->
  <path d="M96 148 q24 -12 48 0" fill="none" stroke="#57534e" stroke-width="3" transform="rotate(-4 120 140)"/>
  <path d="M286 140 q24 -12 48 0" fill="none" stroke="#57534e" stroke-width="3" transform="rotate(-4 310 136)"/>
  <path d="M120 128 v16 M144 128 v16" stroke="#94a3b8" stroke-width="2"/>
  <path d="M310 120 v16 M334 120 v16" stroke="#94a3b8" stroke-width="2"/>
  <!-- masses -->
  <rect x="110" y="126" width="26" height="22" rx="3" fill="#64748b" stroke="#334155" stroke-width="1.5" transform="rotate(-4 123 137)"/>
  <text x="123" y="141" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#ffffff" transform="rotate(-4 123 137)">1 kg</text>
  <rect x="300" y="118" width="26" height="22" rx="3" fill="#64748b" stroke="#334155" stroke-width="1.5" transform="rotate(-4 313 129)"/>
  <text x="313" y="133" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#ffffff" transform="rotate(-4 313 129)">1 kg</text>
  <line x1="215" y1="176" x2="215" y2="286" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>
<circle cx="215" cy="176" r="2.5" fill="#64748b"/>
<text x="215" y="286" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#334155" text-anchor="middle">Équilibre : masses égales</text>
  <text x="215" y="66" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#64748b">La balance compare les masses : le plateau le plus lourd descend</text>

