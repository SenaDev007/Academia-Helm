  <line x1="170" y1="160" x2="30" y2="60" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>
<circle cx="170" cy="160" r="2.5" fill="#64748b"/>
<text x="30" y="60" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#334155" text-anchor="start">Grande roue : tourne lentement</text>
  <line x1="296" y1="160" x2="300" y2="44" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>
<circle cx="296" cy="160" r="2.5" fill="#64748b"/>
