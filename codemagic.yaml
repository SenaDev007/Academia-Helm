# ============================================================================
# CODEMAGIC CI/CD — Academia Helm Mobile (Flutter)
# ============================================================================
#
# Fichier de configuration Codemagic pour les builds Android + iOS.
# 500 minutes gratuites par mois.
#
# Pour configurer :
# 1. Allez sur https://codemagic.io
# 2. Sign up / Login avec GitHub
# 3. Add application →选择 SenaDev007/Academia-Helm
# 4. Select "codemagic.yaml" as workflow type
# 5. Ce fichier sera détecté automatiquement
#
# Pour lancer un build :
# - Push un tag v* → build automatique
# - Ou déclencher manuellement depuis le dashboard Codemagic
# ============================================================================

workflows:
  android-workflow:
    name: Academia Helm Android
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      flutter: 3.24.0
      vars:
        API_BASE_URL:
          value: "https://api.academiahelm.com/api"
      groups:
        - android_credentials
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Install dependencies
        working_directory: apps/mobile-app
        script: |
          flutter pub get

      - name: Generate code (freezed/json_serializable)
        working_directory: apps/mobile-app
        script: |
          dart run build_runner build --delete-conflicting-outputs

      - name: Build APK (release)
        working_directory: apps/mobile-app
        script: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=$API_BASE_URL

      - name: Build App Bundle (release)
        working_directory: apps/mobile-app
        script: |
          flutter build appbundle --release \
            --dart-define=API_BASE_URL=$API_BASE_URL
    artifacts:
      - apps/mobile-app/build/app/outputs/flutter-apk/*.apk
      - apps/mobile-app/build/app/outputs/bundle/release/*.aab
    publishing:
      github:
        token: $GITHUB_TOKEN
        tags: true
        release_notes: "Academia Helm Mobile — Build automatique via Codemagic CI/CD"

  ios-workflow:
    name: Academia Helm iOS
    instance_type: mac_mini_m1
    max_build_duration: 40
    environment:
      flutter: 3.24.0
      vars:
        API_BASE_URL:
          value: "https://api.academiahelm.com/api"
      groups:
        - ios_credentials
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Install dependencies
        working_directory: apps/mobile-app
        script: |
          flutter pub get

      - name: Generate code (freezed/json_serializable)
        working_directory: apps/mobile-app
        script: |
          dart run build_runner build --delete-conflicting-outputs

      - name: Build iOS (no codesign)
        working_directory: apps/mobile-app
        script: |
          flutter build ios --release --no-codesign \
            --dart-define=API_BASE_URL=$API_BASE_URL
    artifacts:
      - apps/mobile-app/build/ios/iphoneos/*.app
      - apps/mobile-app/build/ios/ipa/*.ipa
    publishing:
      github:
        token: $GITHUB_TOKEN
        tags: true
        release_notes: "Academia Helm iOS — Build automatique via Codemagic CI/CD"
