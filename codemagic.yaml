# ============================================================================
# CODEMAGIC CI/CD — Academia Helm Mobile (Flutter)
# ============================================================================

workflows:
  android-workflow:
    name: Academia Helm Android
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      flutter: 3.24.0
      groups:
        - android_credentials
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Install dependencies
        working_directory: apps/mobile-app
        script: |
          flutter pub get

      - name: Generate app icons
        working_directory: apps/mobile-app
        script: |
          dart run flutter_launcher_icons

      - name: Generate code (freezed/json_serializable)
        working_directory: apps/mobile-app
        script: |
          dart run build_runner build --delete-conflicting-outputs

      - name: Build APK (release)
        working_directory: apps/mobile-app
        script: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=https://api.academiahelm.com/api

      - name: Build App Bundle (release)
        working_directory: apps/mobile-app
        script: |
          flutter build appbundle --release \
            --dart-define=API_BASE_URL=https://api.academiahelm.com/api
    artifacts:
      - apps/mobile-app/build/app/outputs/flutter-apk/*.apk
      - apps/mobile-app/build/app/outputs/bundle/release/*.aab

  ios-workflow:
    name: Academia Helm iOS
    instance_type: mac_mini_m1
    max_build_duration: 40
    environment:
      flutter: 3.24.0
      groups:
        - ios_credentials
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Install dependencies
        working_directory: apps/mobile-app
        script: |
          flutter pub get

      - name: Generate app icons
        working_directory: apps/mobile-app
        script: |
          dart run flutter_launcher_icons

      - name: Generate code (freezed/json_serializable)
        working_directory: apps/mobile-app
        script: |
          dart run build_runner build --delete-conflicting-outputs

      - name: Build iOS (no codesign)
        working_directory: apps/mobile-app
        script: |
          flutter build ios --release --no-codesign \
            --dart-define=API_BASE_URL=https://api.academiahelm.com/api
    artifacts:
      - apps/mobile-app/build/ios/iphoneos/*.app
